<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="t">
  <title id="t">A ordem do for: a inicialização roda uma vez; depois, em ciclo, condição, corpo e atualização; quando a condição falha, o laço termina sem rodar a atualização daquela volta</title>
  <rect width="760" height="320" fill="#13110f"/>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/>
    </marker>
  </defs>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="18">
    <text x="60" y="56"><tspan fill="#cf8e6d">for</tspan><tspan fill="#bcbec4"> (</tspan><tspan fill="#ff9447">int i = 0</tspan><tspan fill="#bcbec4">; </tspan><tspan fill="#f2c75c">i &lt; 3</tspan><tspan fill="#bcbec4">; </tspan><tspan fill="#56a8f5">i++</tspan><tspan fill="#bcbec4">) {</tspan></text>
    <text x="100" y="92" fill="#4fd68b">corpo</text>
    <text x="60" y="126" fill="#bcbec4">}</text>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#13110f" text-anchor="middle">
    <circle cx="146" cy="24" r="11" fill="#ff7a1a"/><text x="146" y="28">1</text>
    <circle cx="245" cy="24" r="11" fill="#f2c75c"/><text x="245" y="28">2</text>
    <circle cx="84" cy="88" r="11" fill="#4fd68b"/><text x="84" y="92">3</text>
    <circle cx="320" cy="24" r="11" fill="#56a8f5"/><text x="320" y="28">4</text>
  </g>

  <!-- ciclo -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13" text-anchor="middle">
    <rect x="440" y="30" width="150" height="36" rx="6" fill="#3a1d07" stroke="#ff7a1a"/>
    <text x="515" y="53" fill="#ff9447">1. inicialização</text>
    <rect x="440" y="104" width="150" height="36" rx="6" fill="#2a2410" stroke="#f2c75c"/>
    <text x="515" y="127" fill="#f2c75c">2. condição</text>
    <rect x="440" y="178" width="150" height="36" rx="6" fill="#13221a" stroke="#4fd68b"/>
    <text x="515" y="201" fill="#4fd68b">3. corpo</text>
    <rect x="440" y="252" width="150" height="36" rx="6" fill="#132030" stroke="#56a8f5"/>
    <text x="515" y="275" fill="#56a8f5">4. atualização</text>
  </g>
  <g stroke="#8a8277" stroke-width="1.6" fill="none" marker-end="url(#seta)">
    <line x1="515" y1="66" x2="515" y2="100"/>
    <line x1="515" y1="140" x2="515" y2="174"/>
    <line x1="515" y1="214" x2="515" y2="248"/>
    <path d="M590 270 C 660 270, 660 122, 594 122"/>
    <path d="M440 122 C 380 122, 360 200, 300 200"/>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12">
    <text x="530" y="160" fill="#4fd68b">verdadeira</text>
    <text x="664" y="200" fill="#bdb5aa">volta</text>
    <text x="342" y="140" fill="#db5c5c">falsa: acabou</text>
    <text x="604" y="52" fill="#bdb5aa">uma vez só</text>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#bdb5aa">
    <text x="60" y="178">Com i &lt; 3, a condição é testada 4 vezes:</text>
    <text x="60" y="198">com 0, 1 e 2 ela passa; com 3, falha.</text>
    <text x="60" y="230">O corpo e a atualização rodam 3 vezes,</text>
    <text x="60" y="250">e i termina valendo 3.</text>
  </g>
</svg>
