<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t">
  <title id="t">Como ArrayList e LinkedList guardam os mesmos quatro nomes na memória: o ArrayList tem um array interno, elementData, com as referências lado a lado e espaço sobrando, a capacidade, maior que o size; a LinkedList tem um objeto nó por elemento, espalhados pelo heap, cada um com as referências para o item, o anterior e o próximo</title>
  <rect width="760" height="330" fill="#13110f"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/></marker>
  </defs>
  <text x="20" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#ff7a1a">ArrayList: um array contínuo</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="11">
    <text x="20" y="62" fill="#bdb5aa">elementData</text>
    <rect x="110" y="44" width="70" height="30" fill="#26170c" stroke="#ff7a1a"/>
    <text x="126" y="64" fill="#f3eee7">Ana</text>
    <rect x="180" y="44" width="70" height="30" fill="#26170c" stroke="#ff7a1a"/>
    <text x="196" y="64" fill="#f3eee7">Bia</text>
    <rect x="250" y="44" width="70" height="30" fill="#26170c" stroke="#ff7a1a"/>
    <text x="266" y="64" fill="#f3eee7">Caio</text>
    <rect x="320" y="44" width="70" height="30" fill="#26170c" stroke="#ff7a1a"/>
    <text x="336" y="64" fill="#f3eee7">Davi</text>
    <rect x="390" y="44" width="70" height="30" fill="#1b1916" stroke="#43403a" stroke-dasharray="4 3"/>
    <rect x="460" y="44" width="70" height="30" fill="#1b1916" stroke="#43403a" stroke-dasharray="4 3"/>
    <text x="550" y="56" fill="#bdb5aa">size = 4</text>
    <text x="550" y="72" fill="#6b645b">capacidade = 6</text>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#8a8277">
    <text x="110" y="94">get(2): endereço do início + 2 posições, O(1)</text>
    <text x="110" y="110">ler um elemento traz os vizinhos na mesma linha de cache</text>
  </g>

  <text x="20" y="150" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#4fd68b">LinkedList: nós espalhados pelo heap</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="11">
    <rect x="20" y="168" width="130" height="62" rx="6" fill="#13221a" stroke="#4fd68b"/>
    <text x="32" y="188" fill="#f3eee7">item: Ana</text>
    <text x="32" y="204" fill="#6b645b">prev: null</text>
    <text x="32" y="220" fill="#bdb5aa">next</text>
    <rect x="210" y="226" width="130" height="62" rx="6" fill="#13221a" stroke="#4fd68b"/>
    <text x="222" y="246" fill="#f3eee7">item: Bia</text>
    <text x="222" y="262" fill="#bdb5aa">prev</text>
    <text x="222" y="278" fill="#bdb5aa">next</text>
    <rect x="400" y="168" width="130" height="62" rx="6" fill="#13221a" stroke="#4fd68b"/>
    <text x="412" y="188" fill="#f3eee7">item: Caio</text>
    <text x="412" y="204" fill="#bdb5aa">prev</text>
    <text x="412" y="220" fill="#bdb5aa">next</text>
    <rect x="590" y="226" width="140" height="62" rx="6" fill="#13221a" stroke="#4fd68b"/>
    <text x="602" y="246" fill="#f3eee7">item: Davi</text>
    <text x="602" y="262" fill="#bdb5aa">prev</text>
    <text x="602" y="278" fill="#6b645b">next: null</text>
  </g>
  <g stroke="#8a8277" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M150 216 C 180 216, 180 240, 207 240"/>
    <path d="M340 272 C 370 272, 370 214, 397 214"/>
    <path d="M530 216 C 560 216, 560 240, 587 240"/>
  </g>
  <text x="20" y="316" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">get(2) na LinkedList segue next de nó em nó; cada nó é um objeto, com cabeçalho e três referências.</text>
</svg>
