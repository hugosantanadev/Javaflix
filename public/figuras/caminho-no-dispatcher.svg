<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t">
  <title id="t">O caminho de uma requisição no Spring MVC: GET /produtos/2 chega ao DispatcherServlet, que consulta a tabela de rotas, resolve o parâmetro id com o resolvedor de @PathVariable, chama o método buscar do controller e converte o retorno em JSON com o Jackson; se algo lançar exceção, o resolvedor de exceções monta a resposta de erro, como um 400 ou um 404</title>
  <rect width="760" height="300" fill="#13110f"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/></marker>
    <marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a1a"/></marker>
  </defs>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="11" text-anchor="middle">
    <rect x="16" y="70" width="120" height="56" rx="6" fill="#1b1916" stroke="#8a8277"/>
    <text x="76" y="94" fill="#f3eee7" font-weight="700">GET</text>
    <text x="76" y="112" fill="#bdb5aa">/produtos/2</text>
    <rect x="156" y="70" width="140" height="56" rx="6" fill="#26170c" stroke="#ff7a1a"/>
    <text x="226" y="94" fill="#ff7a1a" font-weight="700">Dispatcher</text>
    <text x="226" y="112" fill="#bdb5aa">tabela de rotas</text>
    <rect x="316" y="70" width="130" height="56" rx="6" fill="#1b1916" stroke="#8a8277"/>
    <text x="381" y="94" fill="#f3eee7" font-weight="700">resolvedores</text>
    <text x="381" y="112" fill="#bdb5aa">id = 2L</text>
    <rect x="466" y="70" width="130" height="56" rx="6" fill="#1b1916" stroke="#8a8277"/>
    <text x="531" y="94" fill="#f3eee7" font-weight="700">buscar(2)</text>
    <text x="531" y="112" fill="#bdb5aa">o seu método</text>
    <rect x="616" y="70" width="128" height="56" rx="6" fill="#13221a" stroke="#4fd68b"/>
    <text x="680" y="94" fill="#4fd68b" font-weight="700">Jackson</text>
    <text x="680" y="112" fill="#bdb5aa">200 + JSON</text>
    <rect x="316" y="190" width="280" height="50" rx="6" fill="#26170c" stroke="#ff7a1a"/>
    <text x="456" y="212" fill="#ff7a1a" font-weight="700">resolvedor de exceções</text>
    <text x="456" y="230" fill="#bdb5aa">400, 404, 405, 415, 406 em Problem Details</text>
  </g>
  <g stroke="#8a8277" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M136 98 L153 98"/>
    <path d="M296 98 L313 98"/>
    <path d="M446 98 L463 98"/>
    <path d="M596 98 L613 98"/>
  </g>
  <g stroke="#ff7a1a" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#l)">
    <path d="M226 126 C 226 170, 290 210, 313 212"/>
    <path d="M381 126 L400 187"/>
    <path d="M531 126 L512 187"/>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#8a8277">
    <text x="150" y="168">sem rota: 404 ou 405</text>
    <text x="350" y="160">"abc" não vira long: 400</text>
    <text x="530" y="160">exceção do serviço</text>
  </g>
  <text x="16" y="282" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#bdb5aa">O seu código é só a caixa buscar(2): todo o resto é o Spring traduzindo HTTP para Java e de volta.</text>
</svg>
