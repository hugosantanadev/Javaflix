<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="t">
  <title id="t">O lado dono de uma relação bidirecional: a classe Pedido tem o campo cliente com @ManyToOne, que vira a coluna cliente_id na tabela pedidos; a classe Cliente tem a lista pedidos com mappedBy, que não vira coluna nenhuma e é só um espelho; o Hibernate grava a chave estrangeira olhando apenas o lado dono</title>
  <rect width="760" height="320" fill="#13110f"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a1a"/></marker>
  </defs>
  <text x="20" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#bdb5aa">Objetos na memória</text>
  <text x="480" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#bdb5aa">Tabelas no banco</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="11">
    <rect x="20" y="44" width="300" height="96" rx="6" fill="#1b1916" stroke="#8a8277"/>
    <text x="32" y="64" fill="#f3eee7" font-weight="700">class Cliente</text>
    <text x="32" y="88" fill="#bdb5aa">@OneToMany(mappedBy = "cliente")</text>
    <text x="32" y="106" fill="#bdb5aa">List&lt;Pedido&gt; pedidos</text>
    <text x="32" y="128" fill="#6b645b">lado inverso: só um espelho</text>

    <rect x="20" y="180" width="300" height="96" rx="6" fill="#26170c" stroke="#ff7a1a"/>
    <text x="32" y="200" fill="#ff7a1a" font-weight="700">class Pedido</text>
    <text x="32" y="224" fill="#bdb5aa">@ManyToOne</text>
    <text x="32" y="242" fill="#bdb5aa">Cliente cliente</text>
    <text x="32" y="264" fill="#ff7a1a">lado dono: decide a coluna</text>

    <rect x="480" y="44" width="260" height="96" rx="6" fill="#1b1916" stroke="#8a8277"/>
    <text x="492" y="64" fill="#f3eee7" font-weight="700">clientes</text>
    <text x="492" y="88" fill="#bdb5aa">id</text>
    <text x="492" y="106" fill="#bdb5aa">nome</text>
    <text x="492" y="128" fill="#6b645b">nenhuma coluna para a lista</text>

    <rect x="480" y="180" width="260" height="96" rx="6" fill="#13221a" stroke="#4fd68b"/>
    <text x="492" y="200" fill="#4fd68b" font-weight="700">pedidos</text>
    <text x="492" y="224" fill="#bdb5aa">id</text>
    <text x="492" y="242" fill="#f2c75c">cliente_id</text>
    <text x="580" y="242" fill="#6b645b">references clientes</text>
    <text x="492" y="264" fill="#6b645b">gravada a partir de Pedido</text>
  </g>
  <g stroke-width="1.5" fill="none">
    <path d="M170 140 L170 177" stroke="#8a8277" stroke-dasharray="4 4" marker-end="url(#a)"/>
    <path d="M320 238 L477 238" stroke="#ff7a1a" marker-end="url(#b)"/>
    <path d="M320 92 L477 92" stroke="#8a8277" stroke-dasharray="4 4"/>
  </g>
  <text x="180" y="163" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#8a8277">mappedBy aponta para o campo</text>
  <text x="340" y="230" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#ff7a1a">vira a FK</text>
  <text x="340" y="84" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#8a8277">não grava nada</text>
  <text x="20" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">Mudar só a lista do cliente não muda o banco: o Hibernate lê o campo cliente de cada pedido.</text>
</svg>
