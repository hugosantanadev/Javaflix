<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t">
  <title id="t">As duas conferências de um cast como (Cachorro) a. Primeiro o javac pergunta se os tipos estão na mesma linha de herança; se não, o código não compila. Depois a JVM pergunta se o objeto real é Cachorro ou subtipo; se não, lança ClassCastException; se sim, o cast funciona. Uma referência null passa direto e o resultado é null</title>
  <rect width="760" height="300" fill="#13110f"/>
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/></marker>
  </defs>
  <text x="30" y="40" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#f3eee7">(Cachorro) a</text>
  <path d="M150 35 L188 35" stroke="#8a8277" stroke-width="1.6" marker-end="url(#s)"/>
  <rect x="192" y="14" width="250" height="44" rx="6" fill="#1b1916" stroke="#ff7a1a"/>
  <text x="206" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#ff7a1a">1. javac, na compilação</text>
  <text x="206" y="50" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#f3eee7">os tipos estão na mesma linha?</text>
  <path d="M442 36 L488 36" stroke="#8a8277" stroke-width="1.6" marker-end="url(#s)"/>
  <text x="452" y="28" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#8a8277">não</text>
  <rect x="492" y="14" width="240" height="44" rx="6" fill="#1b1916" stroke="#43403a"/>
  <text x="506" y="41" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#bdb5aa">não compila</text>
  <path d="M317 60 L317 108" stroke="#8a8277" stroke-width="1.6" marker-end="url(#s)"/>
  <text x="326" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#8a8277">sim</text>
  <rect x="192" y="112" width="250" height="44" rx="6" fill="#1b1916" stroke="#ff7a1a"/>
  <text x="206" y="132" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#ff7a1a">2. JVM, na execução (checkcast)</text>
  <text x="206" y="148" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#f3eee7">o objeto é Cachorro ou subtipo?</text>
  <path d="M442 134 L488 134" stroke="#8a8277" stroke-width="1.6" marker-end="url(#s)"/>
  <text x="452" y="126" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#8a8277">não</text>
  <rect x="492" y="112" width="240" height="44" rx="6" fill="#1b1916" stroke="#ff7a1a"/>
  <text x="506" y="139" font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#ff7a1a">ClassCastException</text>
  <path d="M317 158 L317 206" stroke="#8a8277" stroke-width="1.6" marker-end="url(#s)"/>
  <text x="326" y="188" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#8a8277">sim, ou a é null</text>
  <rect x="192" y="210" width="250" height="44" rx="6" fill="#1b1916" stroke="#4fd68b"/>
  <text x="206" y="237" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#4fd68b">funciona: mesmo objeto, outro tipo</text>
  <text x="30" y="284" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#bdb5aa">O instanceof faz a mesma pergunta da etapa 2, mas responde true ou false em vez de lançar exceção (e null dá false).</text>
</svg>
