<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="t">
  <title id="t">O contêiner do Spring: a varredura começa no pacote br.com.loja, encontra as classes anotadas e lê os métodos @Bean; dentro do ApplicationContext ficam os beans PedidoService, Correios e HttpClient; o PedidoService depende de Frete, e o contêiner injeta o Correios no construtor; uma classe em com.outro, fora do pacote varrido, não vira bean</title>
  <rect width="760" height="310" fill="#13110f"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4fd68b"/></marker>
  </defs>
  <rect x="20" y="40" width="480" height="210" rx="10" fill="#1b1916" stroke="#ff7a1a"/>
  <text x="36" y="64" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ff7a1a">ApplicationContext</text>
  <text x="36" y="84" font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#8a8277">varredura a partir de br.com.loja</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="12" text-anchor="middle">
    <rect x="50" y="110" width="170" height="50" rx="6" fill="#13221a" stroke="#4fd68b"/>
    <text x="135" y="130" fill="#8a8277">@Service</text>
    <text x="135" y="148" fill="#4fd68b" font-weight="700">PedidoService</text>
    <rect x="300" y="110" width="170" height="50" rx="6" fill="#13221a" stroke="#4fd68b"/>
    <text x="385" y="130" fill="#8a8277">@Component</text>
    <text x="385" y="148" fill="#4fd68b" font-weight="700">Correios</text>
    <rect x="300" y="180" width="170" height="50" rx="6" fill="#13221a" stroke="#4fd68b"/>
    <text x="385" y="200" fill="#8a8277">@Bean</text>
    <text x="385" y="218" fill="#4fd68b" font-weight="700">HttpClient</text>
    <rect x="560" y="110" width="170" height="50" rx="6" fill="#13110f" stroke="#43403a" stroke-dasharray="4 3"/>
    <text x="645" y="130" fill="#6b645b">com.outro</text>
    <text x="645" y="148" fill="#6b645b" font-weight="700">Transportadora</text>
  </g>
  <path d="M297 135 L224 135" stroke="#4fd68b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <path d="M385 177 L385 163" stroke="#4fd68b" stroke-width="1.8" fill="none" marker-end="url(#a)"/>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#bdb5aa">
    <text x="232" y="126">injeta como</text>
    <text x="232" y="152">Frete</text>
    <text x="560" y="182">fora da árvore de pacotes:</text>
    <text x="560" y="198">não é encontrada</text>
  </g>
  <text x="20" y="282" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#bdb5aa">O contêiner cria cada bean uma vez, olha o construtor e entrega o que ele pede.</text>
  <text x="20" y="302" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">Nenhum candidato: NoSuchBeanDefinitionException. Dois: NoUniqueBeanDefinitionException.</text>
</svg>
