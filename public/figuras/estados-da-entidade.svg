<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t">
  <title id="t">Os quatro estados de uma entidade JPA: nova, criada com new; gerenciada, depois de persist ou find, quando as mudanças viram SQL no fim da transação; destacada, quando o contexto fecha, e as mudanças são ignoradas; e removida, depois de remove, apagada no fim da transação; o merge leva uma destacada de volta a uma gerenciada</title>
  <rect width="760" height="300" fill="#13110f"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/></marker>
  </defs>
  <g font-family="Segoe UI, system-ui, sans-serif" text-anchor="middle">
    <rect x="30" y="100" width="140" height="60" rx="30" fill="#1b1916" stroke="#8a8277"/>
    <text x="100" y="126" font-size="14" font-weight="700" fill="#f3eee7">Nova</text>
    <text x="100" y="144" font-size="11" fill="#8a8277">new Produto(...)</text>
    <rect x="290" y="100" width="180" height="60" rx="30" fill="#13221a" stroke="#4fd68b"/>
    <text x="380" y="126" font-size="14" font-weight="700" fill="#4fd68b">Gerenciada</text>
    <text x="380" y="144" font-size="11" fill="#bdb5aa">mudanças viram SQL</text>
    <rect x="590" y="40" width="150" height="60" rx="30" fill="#1b1916" stroke="#ff7a1a"/>
    <text x="665" y="66" font-size="14" font-weight="700" fill="#ff7a1a">Destacada</text>
    <text x="665" y="84" font-size="11" fill="#bdb5aa">mudanças ignoradas</text>
    <rect x="590" y="170" width="150" height="60" rx="30" fill="#1b1916" stroke="#8a8277"/>
    <text x="665" y="196" font-size="14" font-weight="700" fill="#f3eee7">Removida</text>
    <text x="665" y="214" font-size="11" fill="#bdb5aa">DELETE no fim</text>
  </g>
  <g stroke="#8a8277" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M170 130 L287 130"/>
    <path d="M470 115 C 530 100, 550 80, 587 72"/>
    <path d="M590 92 C 540 120, 520 125, 473 128"/>
    <path d="M470 145 C 530 165, 550 185, 587 196"/>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="12" font-weight="700">
    <text x="196" y="120" fill="#bdb5aa">persist</text>
    <text x="478" y="84" fill="#bdb5aa">fim da transação</text>
    <text x="500" y="122" fill="#4fd68b">merge</text>
    <text x="510" y="196" fill="#bdb5aa">remove</text>
  </g>
  <text x="290" y="194" font-family="Cascadia Code, Consolas, monospace" font-size="12" font-weight="700" fill="#bdb5aa">find</text>
  <path d="M300 230 L330 163" stroke="#8a8277" stroke-width="1.6" fill="none" marker-end="url(#a)"/>
  <text x="250" y="246" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#8a8277">linha lida do banco</text>
  <text x="30" y="286" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#bdb5aa">Só a entidade gerenciada é acompanhada: alterá-la basta, e o UPDATE sai sozinho no fim da transação.</text>
</svg>
