<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="t">
  <title id="t">A anatomia de um arquivo Java em três camadas, na ordem: o pacote, os imports e os tipos; ao lado, a árvore de pastas src/br/com/loja/Pedido.java, que repete o pacote e o nome da classe pública</title>
  <rect width="760" height="340" fill="#13110f"/>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff7a1a"/>
    </marker>
  </defs>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#8a8277">
    <text x="44" y="40">1. PACOTE: NO MÁXIMO UM, SEMPRE PRIMEIRO</text>
    <text x="44" y="112">2. IMPORTS: ZERO OU MAIS</text>
    <text x="44" y="206">3. TIPOS: UM OU MAIS, NO MÁXIMO UM PUBLIC</text>
  </g>
  <g fill="#1b1916" stroke="#312d28">
    <rect x="30" y="48" width="400" height="40" rx="6"/>
    <rect x="30" y="120" width="400" height="66" rx="6"/>
    <rect x="30" y="214" width="400" height="104" rx="6"/>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="14">
    <text x="46" y="74"><tspan fill="#cf8e6d">package</tspan><tspan fill="#f3eee7"> br.com.loja</tspan><tspan fill="#bcbec4">;</tspan></text>
    <text x="46" y="146"><tspan fill="#cf8e6d">import</tspan><tspan fill="#bcbec4"> java.util.List;</tspan></text>
    <text x="46" y="170"><tspan fill="#cf8e6d">import</tspan><tspan fill="#bcbec4"> java.time.LocalDate;</tspan></text>
    <text x="46" y="240"><tspan fill="#cf8e6d">public class</tspan><tspan fill="#f3eee7"> Pedido</tspan><tspan fill="#bcbec4"> {</tspan></text>
    <text x="70" y="262" fill="#8a8277">// campos e métodos</text>
    <text x="46" y="284" fill="#bcbec4">}</text>
    <text x="46" y="306"><tspan fill="#cf8e6d">class</tspan><tspan fill="#bcbec4"> Item { }</tspan></text>
  </g>

  <!-- pastas -->
  <text x="490" y="40" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2" fill="#8a8277">AS PASTAS REPETEM O PACOTE</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#bdb5aa">
    <text x="490" y="78">src/</text>
    <text x="510" y="106">br/</text>
    <text x="530" y="134">com/</text>
    <text x="550" y="162" fill="#f3eee7">loja/</text>
    <rect x="564" y="174" width="128" height="26" rx="4" fill="#3a1d07" stroke="#ff7a1a"/>
    <text x="574" y="192" fill="#ff9447">Pedido.java</text>
  </g>
  <g stroke="#43403a" stroke-width="1.2" fill="none">
    <path d="M496 84 v18 h10"/>
    <path d="M516 112 v18 h10"/>
    <path d="M536 140 v18 h10"/>
    <path d="M556 168 v19 h6"/>
  </g>

  <g fill="none" stroke="#ff7a1a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#seta)">
    <path d="M232 68 C 340 68, 420 120, 540 152"/>
    <path d="M196 236 C 330 236, 430 210, 560 192"/>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#bdb5aa">
    <text x="490" y="236">a classe public dá</text>
    <text x="490" y="254">o nome do arquivo</text>
    <text x="490" y="290" fill="#8a8277">compile com javac -d out:</text>
    <text x="490" y="308" fill="#8a8277">ele recria as pastas sozinho</text>
  </g>
</svg>
