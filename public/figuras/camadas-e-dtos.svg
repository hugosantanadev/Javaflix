<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t">
  <title id="t">Uma requisição POST /pedidos entra no controller como NovoPedido, um DTO; o service recebe o DTO, monta a entidade Pedido e a salva pelo repository no banco; na volta, a entidade vira PedidoResposta, outro DTO, e só ele sai em JSON</title>
  <rect width="760" height="330" fill="#13110f"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/></marker>
  </defs>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f3eee7" text-anchor="middle">
    <rect x="20" y="40" width="120" height="180" rx="8" fill="#1b1916" stroke="#8a8277"/>
    <text x="80" y="64">Cliente</text>
    <rect x="190" y="40" width="150" height="180" rx="8" fill="#1b1916" stroke="#ff7a1a"/>
    <text x="265" y="64">Controller</text>
    <rect x="390" y="40" width="150" height="180" rx="8" fill="#1b1916" stroke="#8a8277"/>
    <text x="465" y="64">Service</text>
    <rect x="590" y="40" width="150" height="180" rx="8" fill="#1b1916" stroke="#8a8277"/>
    <text x="665" y="64">Repository</text>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#8a8277" text-anchor="middle">
    <text x="80" y="82">JSON</text>
    <text x="265" y="82">HTTP, validação, status</text>
    <text x="465" y="82">regras, transação</text>
    <text x="665" y="82">SQL</text>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">
    <rect x="200" y="104" width="130" height="30" rx="4" fill="#26170c" stroke="#ff7a1a"/>
    <text x="265" y="124" fill="#ff7a1a">NovoPedido</text>
    <rect x="400" y="104" width="130" height="30" rx="4" fill="#13221a" stroke="#4fd68b"/>
    <text x="465" y="124" fill="#4fd68b">Pedido</text>
    <rect x="600" y="104" width="130" height="30" rx="4" fill="#13221a" stroke="#4fd68b"/>
    <text x="665" y="124" fill="#4fd68b">Pedido</text>
    <rect x="200" y="170" width="130" height="30" rx="4" fill="#26170c" stroke="#ff7a1a"/>
    <text x="265" y="190" fill="#ff7a1a">PedidoResposta</text>
    <rect x="400" y="170" width="130" height="30" rx="4" fill="#13221a" stroke="#4fd68b"/>
    <text x="465" y="190" fill="#4fd68b">Pedido</text>
  </g>
  <g stroke="#8a8277" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M140 119 L197 119"/>
    <path d="M330 119 L397 119"/>
    <path d="M530 119 L597 119"/>
    <path d="M597 140 L533 178"/>
    <path d="M400 185 L333 185"/>
    <path d="M200 185 L143 185"/>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12">
    <rect x="200" y="252" width="14" height="14" rx="3" fill="#26170c" stroke="#ff7a1a"/>
    <text x="222" y="264" fill="#bdb5aa">DTO: o contrato da API, record sem lógica</text>
    <rect x="200" y="280" width="14" height="14" rx="3" fill="#13221a" stroke="#4fd68b"/>
    <text x="222" y="292" fill="#bdb5aa">Entidade: o modelo do banco, nunca sai do servidor</text>
  </g>
  <text x="20" y="318" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#8a8277">A fronteira laranja é onde o JSON vira objeto, e o lugar certo para validar e para escolher o que sai.</text>
</svg>
