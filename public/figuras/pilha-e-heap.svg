<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t">
  <title id="t">Variáveis na pilha guardam referências para objetos no heap: p1 e p2 apontam para o mesmo Ponto com x 3 e y 7; p3 aponta para outro Ponto com os mesmos valores</title>
  <rect width="760" height="330" fill="#13110f"/>
  <defs>
    <marker id="s-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4fd68b"/></marker>
    <marker id="s-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56a8f5"/></marker>
  </defs>

  <rect x="30" y="50" width="170" height="220" rx="8" fill="none" stroke="#43403a"/>
  <text x="44" y="72" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">pilha: o método main</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="14" font-weight="700">
    <text x="50" y="114" fill="#f3eee7">p1</text>
    <text x="50" y="174" fill="#f3eee7">p2</text>
    <text x="50" y="234" fill="#f3eee7">p3</text>
  </g>
  <g>
    <rect x="96" y="92" width="80" height="34" rx="4" fill="#1b1916" stroke="#43403a"/><circle cx="136" cy="109" r="4" fill="#4fd68b"/>
    <rect x="96" y="152" width="80" height="34" rx="4" fill="#1b1916" stroke="#43403a"/><circle cx="136" cy="169" r="4" fill="#4fd68b"/>
    <rect x="96" y="212" width="80" height="34" rx="4" fill="#1b1916" stroke="#43403a"/><circle cx="136" cy="229" r="4" fill="#56a8f5"/>
  </g>

  <rect x="260" y="50" width="470" height="220" rx="8" fill="none" stroke="#43403a"/>
  <text x="714" y="72" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277" text-anchor="end">heap</text>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12">
    <rect x="380" y="86" width="150" height="96" rx="6" fill="#13221a" stroke="#4fd68b"/>
    <text x="392" y="106" fill="#7fae8f">cabeçalho (Ponto)</text>
    <line x1="380" y1="114" x2="530" y2="114" stroke="#2f5a3f"/>
    <line x1="380" y1="148" x2="530" y2="148" stroke="#2f5a3f"/>
    <rect x="560" y="166" width="150" height="96" rx="6" fill="#0f1b26" stroke="#56a8f5"/>
    <text x="572" y="186" fill="#7fa6c8">cabeçalho (Ponto)</text>
    <line x1="560" y1="194" x2="710" y2="194" stroke="#2c4a63"/>
    <line x1="560" y1="228" x2="710" y2="228" stroke="#2c4a63"/>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="14" font-weight="700">
    <text x="392" y="137" fill="#4fd68b">x = 3</text>
    <text x="392" y="171" fill="#4fd68b">y = 7</text>
    <text x="572" y="217" fill="#56a8f5">x = 3</text>
    <text x="572" y="251" fill="#56a8f5">y = 7</text>
  </g>

  <g stroke-width="1.8" fill="none">
    <path d="M140 109 C 260 109, 300 120, 376 126" stroke="#4fd68b" marker-end="url(#s-verde)"/>
    <path d="M140 169 C 260 169, 300 150, 376 144" stroke="#4fd68b" marker-end="url(#s-verde)"/>
    <path d="M140 229 C 320 229, 480 214, 556 214" stroke="#56a8f5" marker-end="url(#s-azul)"/>
  </g>

  <g font-family="Cascadia Code, Consolas, monospace" font-size="13">
    <text x="30" y="302" fill="#4fd68b">p1 == p2 → true</text>
    <text x="220" y="302" fill="#56a8f5">p1 == p3 → false</text>
  </g>
  <text x="420" y="302" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#8a8277">Mesmos valores, objetos diferentes.</text>
</svg>
