<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t">
  <title id="t">O contrato do throws na sobrescrita: o código que usa um Leitor só se preparou para IOException; das subclasses, a que declara FileNotFoundException, a que não declara nada e a que declara IllegalStateException, unchecked, compilam; a que declara Exception, mais ampla, não compila, porque lançaria algo que o código que usa Leitor não espera</title>
  <rect width="760" height="330" fill="#13110f"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/></marker>
  </defs>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="11">
    <rect x="200" y="20" width="360" height="66" rx="8" fill="#1b1916" stroke="#8a8277"/>
    <text x="214" y="42" fill="#f3eee7" font-weight="700">String ler() throws IOException</text>
    <text x="214" y="64" fill="#bdb5aa">quem usa Leitor: catch (IOException e)</text>

    <rect x="20" y="150" width="170" height="74" rx="6" fill="#13221a" stroke="#4fd68b"/>
    <text x="32" y="172" fill="#4fd68b" font-weight="700">LeitorDeArquivo</text>
    <text x="32" y="194" fill="#bdb5aa">throws</text>
    <text x="32" y="210" fill="#bdb5aa">FileNotFoundException</text>

    <rect x="205" y="150" width="170" height="74" rx="6" fill="#13221a" stroke="#4fd68b"/>
    <text x="217" y="172" fill="#4fd68b" font-weight="700">LeitorDeMemoria</text>
    <text x="217" y="194" fill="#bdb5aa">nenhum throws</text>

    <rect x="390" y="150" width="170" height="74" rx="6" fill="#13221a" stroke="#4fd68b"/>
    <text x="402" y="172" fill="#4fd68b" font-weight="700">LeitorInstavel</text>
    <text x="402" y="194" fill="#bdb5aa">throws</text>
    <text x="402" y="210" fill="#bdb5aa">IllegalStateException</text>

    <rect x="575" y="150" width="165" height="74" rx="6" fill="#2a1414" stroke="#db5c5c"/>
    <text x="587" y="172" fill="#db5c5c" font-weight="700">LeitorGeral</text>
    <text x="587" y="194" fill="#bdb5aa">throws Exception</text>
  </g>
  <g stroke="#8a8277" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M105 150 L300 89"/>
    <path d="M290 150 L350 89"/>
    <path d="M475 150 L420 89"/>
    <path d="M657 150 L470 89" stroke="#db5c5c" stroke-dasharray="5 4"/>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="11">
    <text x="32" y="244" fill="#4fd68b">mais estreita: compila</text>
    <text x="217" y="244" fill="#4fd68b">menos: compila</text>
    <text x="402" y="244" fill="#4fd68b">unchecked: compila</text>
    <text x="587" y="244" fill="#db5c5c">mais ampla: não compila</text>
  </g>
  <text x="20" y="286" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">A subclasse pode prometer menos que a superclasse, nunca mais. Nos construtores é o contrário:</text>
  <text x="20" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">o da subclasse precisa declarar as checked do construtor da superclasse, que ele chama.</text>
</svg>
