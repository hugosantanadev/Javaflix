<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t">
  <title id="t">A ordem de inicialização da classe Ordem: primeiro o bloco static, uma vez; depois o main; a cada new, o campo x e o bloco de instância, na ordem do código, e por último o corpo do construtor</title>
  <rect width="760" height="330" fill="#13110f"/>
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/></marker>
    <marker id="s-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4fd68b"/></marker>
  </defs>

  <g font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#bcbec4">
    <text x="30" y="50">public class Ordem {</text>
    <text x="60" y="82" fill="#f2c75c">static { ... }</text>
    <text x="60" y="114" fill="#4fd68b">int x = valor(...);</text>
    <text x="60" y="146" fill="#4fd68b">{ ... }</text>
    <text x="60" y="178" fill="#56a8f5">Ordem() { ... }</text>
    <text x="60" y="210" fill="#bcbec4">main(...) {</text>
    <text x="90" y="236" fill="#bcbec4">new Ordem();</text>
    <text x="90" y="262" fill="#bcbec4">new Ordem();</text>
    <text x="60" y="288">}</text>
    <text x="30" y="314">}</text>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#13110f" text-anchor="middle">
    <circle cx="250" cy="78" r="11" fill="#f2c75c"/><text x="250" y="82">1</text>
    <circle cx="250" cy="206" r="11" fill="#bcbec4"/><text x="250" y="210">2</text>
    <circle cx="250" cy="110" r="11" fill="#4fd68b"/><text x="250" y="114">3</text>
    <circle cx="250" cy="142" r="11" fill="#4fd68b"/><text x="250" y="146">4</text>
    <circle cx="250" cy="174" r="11" fill="#56a8f5"/><text x="250" y="178">5</text>
  </g>

  <line x1="300" y1="30" x2="300" y2="300" stroke="#2b2824"/>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13">
    <rect x="330" y="44" width="400" height="56" rx="6" fill="#2a2410" stroke="#f2c75c"/>
    <text x="346" y="67" fill="#f2c75c" font-weight="700">1. a classe é inicializada, uma vez</text>
    <text x="346" y="87" fill="#bcbec4">campos e blocos static, na ordem do código</text>
    <rect x="330" y="116" width="400" height="34" rx="6" fill="#1b1916" stroke="#43403a"/>
    <text x="346" y="138" fill="#bcbec4"><tspan font-weight="700">2. o main começa</tspan> (ele é da classe já pronta)</text>
    <rect x="330" y="166" width="400" height="56" rx="6" fill="#13221a" stroke="#4fd68b"/>
    <text x="346" y="189" fill="#4fd68b" font-weight="700">3 e 4. a cada new: campos e blocos de instância</text>
    <text x="346" y="209" fill="#bcbec4">na ordem do código, depois do super(...)</text>
    <rect x="330" y="238" width="400" height="34" rx="6" fill="#0f1b26" stroke="#56a8f5"/>
    <text x="346" y="260" fill="#56a8f5" font-weight="700">5. o resto do corpo do construtor</text>
  </g>
  <g stroke="#8a8277" stroke-width="1.4" fill="none" marker-end="url(#s)">
    <path d="M530 100 L530 112"/>
    <path d="M530 150 L530 162"/>
    <path d="M530 222 L530 234"/>
  </g>
  <path d="M732 255 C 752 255, 752 194, 734 194" stroke="#4fd68b" stroke-width="1.6" fill="none" marker-end="url(#s-verde)"/>
  <text x="600" y="298" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#4fd68b">próximo new: de volta ao 3</text>
</svg>
