<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t">
  <title id="t">Árvore de recursos de uma API de pedidos: a coleção /pedidos aceita GET e POST; o item /pedidos/{id} aceita GET, PUT, PATCH e DELETE; o sub-recurso /pedidos/{id}/itens aceita GET e POST; e /pedidos/{id}/itens/{item} aceita GET e DELETE; caminho fora da árvore é 404, método fora da lista é 405</title>
  <rect width="760" height="300" fill="#13110f"/>
  <g stroke="#8a8277" stroke-width="1.4" fill="none">
    <path d="M90 74 L90 120 L120 120"/>
    <path d="M150 136 L150 182 L180 182"/>
    <path d="M220 198 L220 244 L250 244"/>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700">
    <rect x="40" y="42" width="200" height="32" rx="4" fill="#1b1916" stroke="#8a8277"/>
    <text x="54" y="63" fill="#f3eee7">/pedidos</text>
    <rect x="120" y="104" width="220" height="32" rx="4" fill="#1b1916" stroke="#8a8277"/>
    <text x="134" y="125" fill="#f3eee7">/pedidos/{id}</text>
    <rect x="180" y="166" width="260" height="32" rx="4" fill="#1b1916" stroke="#8a8277"/>
    <text x="194" y="187" fill="#f3eee7">/pedidos/{id}/itens</text>
    <rect x="250" y="228" width="300" height="32" rx="4" fill="#1b1916" stroke="#8a8277"/>
    <text x="264" y="249" fill="#f3eee7">/pedidos/{id}/itens/{item}</text>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="12" font-weight="700" fill="#4fd68b">
    <text x="260" y="63" xml:space="preserve">GET  POST</text>
    <text x="360" y="125" xml:space="preserve">GET  PUT  PATCH  DELETE</text>
    <text x="460" y="187" xml:space="preserve">GET  POST</text>
    <text x="570" y="249" xml:space="preserve">GET  DELETE</text>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12">
    <text x="440" y="56" fill="#8a8277">coleção: listar e criar</text>
    <text x="40" y="288" fill="#bdb5aa">Caminho fora da árvore: 404. Caminho que existe com um método fora da lista verde: 405, com o cabeçalho Allow.</text>
  </g>
</svg>
