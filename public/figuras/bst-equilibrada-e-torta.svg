<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="t">
  <title id="t">Duas árvores binárias de busca com os mesmos sete valores. À esquerda, inseridos na ordem 50, 30, 70, 20, 40, 60, 80, a árvore fica equilibrada, com altura 3. À direita, inseridos já em ordem crescente, 20, 30, 40 até 80, cada nó só tem filho direito e a árvore vira uma lista com altura 7</title>
  <rect width="760" height="310" fill="#13110f"/>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#8a8277">
    <text x="40" y="28">inserção 50, 30, 70, 20, 40, 60, 80: altura 3</text>
    <text x="440" y="28">inserção 20, 30, 40, ..., 80: altura 7</text>
  </g>
  <g stroke="#43403a" stroke-width="1.5">
    <path d="M200 70 L120 140"/><path d="M200 70 L280 140"/><path d="M120 140 L80 210"/><path d="M120 140 L160 210"/><path d="M280 140 L240 210"/><path d="M280 140 L320 210"/>
    <path d="M460 55 L495 90"/><path d="M495 90 L530 125"/><path d="M530 125 L565 160"/><path d="M565 160 L600 195"/><path d="M600 195 L635 230"/><path d="M635 230 L670 265"/>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="13" text-anchor="middle">
    <g fill="#1b1916" stroke="#4fd68b">
      <circle cx="200" cy="70" r="20"/><circle cx="120" cy="140" r="20"/><circle cx="280" cy="140" r="20"/><circle cx="80" cy="210" r="20"/><circle cx="160" cy="210" r="20"/><circle cx="240" cy="210" r="20"/><circle cx="320" cy="210" r="20"/>
    </g>
    <g fill="#f3eee7"><text x="200" y="75">50</text><text x="120" y="145">30</text><text x="280" y="145">70</text><text x="80" y="215">20</text><text x="160" y="215">40</text><text x="240" y="215">60</text><text x="320" y="215">80</text></g>
    <g fill="#1b1916" stroke="#ff7a1a">
      <circle cx="460" cy="55" r="17"/><circle cx="495" cy="90" r="17"/><circle cx="530" cy="125" r="17"/><circle cx="565" cy="160" r="17"/><circle cx="600" cy="195" r="17"/><circle cx="635" cy="230" r="17"/><circle cx="670" cy="265" r="17"/>
    </g>
    <g fill="#f3eee7" font-size="12"><text x="460" y="59">20</text><text x="495" y="94">30</text><text x="530" y="129">40</text><text x="565" y="164">50</text><text x="600" y="199">60</text><text x="635" y="234">70</text><text x="670" y="269">80</text></g>
  </g>
  <text x="40" y="262" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#4fd68b">buscar o 80: 3 comparações</text>
  <text x="40" y="282" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#ff7a1a">na árvore torta: 7, como numa lista ligada</text>
</svg>
