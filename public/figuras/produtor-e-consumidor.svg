<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="t">
  <title id="t">A regra PECS no método copiar: a lista de origem, declarada como List de extends T, é a produtora, porque o método só lê dela; a lista de destino, List de super T, é a consumidora, porque o método só escreve nela; embaixo, exemplos da biblioteca: Comparator, Consumer e Predicate consomem elementos e aparecem com super T, e Function consome T e produz R</title>
  <rect width="760" height="320" fill="#13110f"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/></marker>
  </defs>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="12">
    <rect x="20" y="40" width="220" height="80" rx="8" fill="#26170c" stroke="#ff7a1a"/>
    <text x="34" y="64" fill="#ff7a1a" font-weight="700">origem</text>
    <text x="34" y="86" fill="#f3eee7">List&lt;? extends T&gt;</text>
    <text x="34" y="106" fill="#bdb5aa">produz: o método lê</text>

    <rect x="290" y="40" width="180" height="80" rx="8" fill="#1b1916" stroke="#8a8277"/>
    <text x="304" y="64" fill="#f3eee7" font-weight="700">copiar</text>
    <text x="304" y="86" fill="#bdb5aa">for (T item : origem)</text>
    <text x="320" y="106" fill="#bdb5aa">destino.add(item)</text>

    <rect x="520" y="40" width="220" height="80" rx="8" fill="#13221a" stroke="#4fd68b"/>
    <text x="534" y="64" fill="#4fd68b" font-weight="700">destino</text>
    <text x="534" y="86" fill="#f3eee7">List&lt;? super T&gt;</text>
    <text x="534" y="106" fill="#bdb5aa">consome: o método escreve</text>
  </g>
  <g stroke="#8a8277" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M240 80 L287 80"/>
    <path d="M470 80 L517 80"/>
  </g>
  <text x="20" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#bdb5aa">Na biblioteca padrão</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="12">
    <text x="20" y="188" fill="#f3eee7">List.sort(Comparator&lt;<tspan fill="#4fd68b">? super E</tspan>&gt; c)</text>
    <text x="20" y="212" fill="#f3eee7">forEach(Consumer&lt;<tspan fill="#4fd68b">? super T</tspan>&gt; acao)</text>
    <text x="20" y="236" fill="#f3eee7">addAll(Collection&lt;<tspan fill="#ff7a1a">? extends E</tspan>&gt; c)</text>
    <text x="20" y="260" fill="#f3eee7">map(Function&lt;<tspan fill="#4fd68b">? super T</tspan>, <tspan fill="#ff7a1a">? extends R</tspan>&gt; f)</text>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12">
    <text x="440" y="188" fill="#bdb5aa">o comparador consome elementos</text>
    <text x="440" y="212" fill="#bdb5aa">a ação consome</text>
    <text x="440" y="236" fill="#bdb5aa">a coleção recebida produz</text>
    <text x="440" y="260" fill="#bdb5aa">consome T, produz R</text>
  </g>
  <text x="20" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">Producer extends, consumer super: olhe cada parâmetro do ponto de vista do método.</text>
</svg>
