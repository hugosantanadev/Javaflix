<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="t">
  <title id="t">Os índices do substring como cortes entre as letras de Javaflix: substring(1, 4) vai do corte 1 ao corte 4 e dá "ava", com 3 caracteres; substring(4) vai do corte 4 até o fim e dá "flix"</title>
  <rect width="760" height="320" fill="#13110f"/>
  <text x="156" y="40" font-family="Cascadia Code, Consolas, monospace" font-size="15" fill="#f3eee7">String s = "Javaflix";</text>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#8a8277" text-anchor="middle">
    <text x="184" y="84">0</text><text x="240" y="84">1</text><text x="296" y="84">2</text><text x="352" y="84">3</text>
    <text x="408" y="84">4</text><text x="464" y="84">5</text><text x="520" y="84">6</text><text x="576" y="84">7</text>
  </g>
  <text x="140" y="84" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#8a8277" text-anchor="end">charAt</text>

  <g>
    <rect x="156" y="94" width="56" height="54" fill="#1b1916" stroke="#43403a"/>
    <rect x="212" y="94" width="56" height="54" fill="#3a1d07" stroke="#43403a"/>
    <rect x="268" y="94" width="56" height="54" fill="#3a1d07" stroke="#43403a"/>
    <rect x="324" y="94" width="56" height="54" fill="#3a1d07" stroke="#43403a"/>
    <rect x="380" y="94" width="56" height="54" fill="#13221a" stroke="#43403a"/>
    <rect x="436" y="94" width="56" height="54" fill="#13221a" stroke="#43403a"/>
    <rect x="492" y="94" width="56" height="54" fill="#13221a" stroke="#43403a"/>
    <rect x="548" y="94" width="56" height="54" fill="#13221a" stroke="#43403a"/>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="22" font-weight="700" text-anchor="middle">
    <text x="184" y="129" fill="#bcbec4">J</text>
    <text x="240" y="129" fill="#ff9447">a</text><text x="296" y="129" fill="#ff9447">v</text><text x="352" y="129" fill="#ff9447">a</text>
    <text x="408" y="129" fill="#4fd68b">f</text><text x="464" y="129" fill="#4fd68b">l</text><text x="520" y="129" fill="#4fd68b">i</text><text x="576" y="129" fill="#4fd68b">x</text>
  </g>

  <g stroke="#f2c75c" stroke-width="1.4" stroke-dasharray="4 3">
    <line x1="156" y1="88" x2="156" y2="166"/><line x1="212" y1="88" x2="212" y2="166"/><line x1="268" y1="88" x2="268" y2="166"/>
    <line x1="324" y1="88" x2="324" y2="166"/><line x1="380" y1="88" x2="380" y2="166"/><line x1="436" y1="88" x2="436" y2="166"/>
    <line x1="492" y1="88" x2="492" y2="166"/><line x1="548" y1="88" x2="548" y2="166"/><line x1="604" y1="88" x2="604" y2="166"/>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700" fill="#f2c75c" text-anchor="middle">
    <text x="156" y="182">0</text><text x="212" y="182">1</text><text x="268" y="182">2</text><text x="324" y="182">3</text><text x="380" y="182">4</text>
    <text x="436" y="182">5</text><text x="492" y="182">6</text><text x="548" y="182">7</text><text x="604" y="182">8</text>
  </g>
  <text x="140" y="182" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#f2c75c" text-anchor="end">cortes</text>

  <path d="M212 198 L212 206 L380 206 L380 198" fill="none" stroke="#ff9447" stroke-width="1.8"/>
  <text x="296" y="228" font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#ff9447" text-anchor="middle">s.substring(1, 4) = "ava"</text>
  <text x="296" y="246" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#bcbec4" text-anchor="middle">4 − 1 = 3 caracteres</text>

  <path d="M380 256 L380 264 L604 264 L604 256" fill="none" stroke="#4fd68b" stroke-width="1.8"/>
  <text x="492" y="284" font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#4fd68b" text-anchor="middle">s.substring(4) = "flix"</text>

  <text x="30" y="310" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#8a8277">Leia os números do substring como cortes entre as letras: o fim é onde a tesoura para.</text>
</svg>
