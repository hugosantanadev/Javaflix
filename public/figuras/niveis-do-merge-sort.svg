<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="t">
  <title id="t">A intercalação do merge sort com 8 elementos, de baixo para cima. No primeiro nível, oito pedaços de 1 viram quatro pares ordenados; no segundo, dois blocos de 4; no terceiro, o array inteiro ordenado. São log de 8 na base 2, ou seja, 3 níveis, e cada nível mexe nos 8 elementos</title>
  <rect width="760" height="310" fill="#13110f"/>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="14" text-anchor="middle">
    <g fill="#1b1916" stroke="#43403a">
      <rect x="40" y="240" width="56" height="36"/><rect x="104" y="240" width="56" height="36"/><rect x="168" y="240" width="56" height="36"/><rect x="232" y="240" width="56" height="36"/><rect x="296" y="240" width="56" height="36"/><rect x="360" y="240" width="56" height="36"/><rect x="424" y="240" width="56" height="36"/><rect x="488" y="240" width="56" height="36"/>
    </g>
    <g fill="#bdb5aa"><text x="68" y="263">38</text><text x="132" y="263">27</text><text x="196" y="263">43</text><text x="260" y="263">3</text><text x="324" y="263">9</text><text x="388" y="263">82</text><text x="452" y="263">10</text><text x="516" y="263">5</text></g>
    <g fill="#1b1916" stroke="#f2c75c">
      <rect x="40" y="170" width="120" height="36"/><rect x="168" y="170" width="120" height="36"/><rect x="296" y="170" width="120" height="36"/><rect x="424" y="170" width="120" height="36"/>
    </g>
    <g fill="#f3eee7"><text x="100" y="193">27 38</text><text x="228" y="193">3 43</text><text x="356" y="193">9 82</text><text x="484" y="193">5 10</text></g>
    <g fill="#1b1916" stroke="#ff7a1a">
      <rect x="40" y="100" width="248" height="36"/><rect x="296" y="100" width="248" height="36"/>
    </g>
    <g fill="#f3eee7"><text x="164" y="123">3 27 38 43</text><text x="420" y="123">5 9 10 82</text></g>
    <rect x="40" y="30" width="504" height="36" fill="#1b1916" stroke="#4fd68b"/>
    <text x="292" y="53" fill="#4fd68b">3 5 9 10 27 38 43 82</text>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#bdb5aa">
    <text x="570" y="263">8 pedaços de 1</text>
    <text x="570" y="193">nível 1: mexe em 8</text>
    <text x="570" y="123">nível 2: mexe em 8</text>
    <text x="570" y="53">nível 3: mexe em 8</text>
  </g>
  <text x="40" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#bdb5aa">log₂ 8 = 3 níveis, n = 8 de trabalho em cada: n · log₂ n = 24.</text>
</svg>
