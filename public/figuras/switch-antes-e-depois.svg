<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t">
  <title id="t">O mesmo cálculo de dias do mês escrito como switch clássico, com variável declarada antes, break em cada case e risco de fall-through, e como switch expressão com setas, que devolve o valor direto</title>
  <rect width="760" height="330" fill="#13110f"/>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">
    <text x="30" y="32" fill="#8a8277">CLÁSSICO, COM DOIS-PONTOS</text>
    <text x="400" y="32" fill="#4fd68b">EXPRESSÃO, COM SETAS (JAVA 14+)</text>
  </g>
  <rect x="20" y="44" width="350" height="248" rx="8" fill="#191714" stroke="#2b2824"/>
  <rect x="390" y="44" width="350" height="160" rx="8" fill="#14201a" stroke="#2c4a37"/>

  <g font-family="Cascadia Code, Consolas, monospace" font-size="13">
    <text x="36" y="72"><tspan fill="#cf8e6d">int</tspan><tspan fill="#bcbec4"> dias;</tspan></text>
    <text x="36" y="94"><tspan fill="#cf8e6d">switch</tspan><tspan fill="#bcbec4"> (mes) {</tspan></text>
    <text x="52" y="116"><tspan fill="#cf8e6d">case</tspan><tspan fill="#2aacb8"> 2</tspan><tspan fill="#bcbec4">:</tspan></text>
    <text x="68" y="138"><tspan fill="#bcbec4">dias = </tspan><tspan fill="#2aacb8">28</tspan><tspan fill="#bcbec4">;</tspan></text>
    <text x="68" y="160" fill="#db5c5c">break;</text>
    <text x="52" y="182"><tspan fill="#cf8e6d">case</tspan><tspan fill="#2aacb8"> 4</tspan><tspan fill="#bcbec4">, </tspan><tspan fill="#2aacb8">6</tspan><tspan fill="#bcbec4">, </tspan><tspan fill="#2aacb8">9</tspan><tspan fill="#bcbec4">, </tspan><tspan fill="#2aacb8">11</tspan><tspan fill="#bcbec4">:</tspan></text>
    <text x="68" y="204"><tspan fill="#bcbec4">dias = </tspan><tspan fill="#2aacb8">30</tspan><tspan fill="#bcbec4">;</tspan></text>
    <text x="68" y="226" fill="#db5c5c">break;</text>
    <text x="52" y="248"><tspan fill="#cf8e6d">default</tspan><tspan fill="#bcbec4">:</tspan></text>
    <text x="68" y="270"><tspan fill="#bcbec4">dias = </tspan><tspan fill="#2aacb8">31</tspan><tspan fill="#bcbec4">;  }</tspan></text>

    <text x="406" y="72"><tspan fill="#cf8e6d">int</tspan><tspan fill="#bcbec4"> dias = </tspan><tspan fill="#cf8e6d">switch</tspan><tspan fill="#bcbec4"> (mes) {</tspan></text>
    <text x="422" y="98"><tspan fill="#cf8e6d">case</tspan><tspan fill="#2aacb8"> 2</tspan><tspan fill="#4fd68b"> -&gt; </tspan><tspan fill="#2aacb8">28</tspan><tspan fill="#bcbec4">;</tspan></text>
    <text x="422" y="124"><tspan fill="#cf8e6d">case</tspan><tspan fill="#2aacb8"> 4</tspan><tspan fill="#bcbec4">, </tspan><tspan fill="#2aacb8">6</tspan><tspan fill="#bcbec4">, </tspan><tspan fill="#2aacb8">9</tspan><tspan fill="#bcbec4">, </tspan><tspan fill="#2aacb8">11</tspan><tspan fill="#4fd68b"> -&gt; </tspan><tspan fill="#2aacb8">30</tspan><tspan fill="#bcbec4">;</tspan></text>
    <text x="422" y="150"><tspan fill="#cf8e6d">default</tspan><tspan fill="#4fd68b"> -&gt; </tspan><tspan fill="#2aacb8">31</tspan><tspan fill="#bcbec4">;</tspan></text>
    <text x="406" y="176" fill="#bcbec4">};</text>
  </g>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12.5">
    <text x="200" y="152" fill="#db5c5c">esqueceu um break?</text>
    <text x="200" y="168" fill="#db5c5c">o case de baixo roda junto</text>
    <text x="400" y="232" fill="#bdb5aa">• a variável nasce já com valor</text>
    <text x="400" y="252" fill="#bdb5aa">• sem break e sem fall-through</text>
    <text x="400" y="272" fill="#bdb5aa">• o compilador exige um valor para todo mês</text>
  </g>
  <text x="30" y="318" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#bdb5aa">Mesmo resultado, metade das linhas e dois tipos de erro a menos.</text>
</svg>
