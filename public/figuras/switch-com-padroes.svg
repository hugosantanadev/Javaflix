<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="t">
  <title id="t">O valor -3 desce pela lista de case de cima para baixo. case null não casa; case Integer i when i menor que 0 casa, porque o tipo bate e a guarda é verdadeira, e esse case vence. Os case abaixo, Integer i, String s e default, nem são testados</title>
  <rect width="760" height="310" fill="#13110f"/>
  <defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a1a"/></marker></defs>
  <text x="30" y="36" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#ff7a1a">switch (-3)</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="13">
    <rect x="200" y="20" width="330" height="40" rx="6" fill="#1b1916" stroke="#43403a"/><text x="216" y="45" fill="#bdb5aa">case null</text>
    <rect x="200" y="72" width="330" height="40" rx="6" fill="#1b1916" stroke="#4fd68b" stroke-width="2"/><text x="216" y="97" fill="#f3eee7">case Integer i <tspan fill="#f2c75c">when i &lt; 0</tspan></text>
    <rect x="200" y="124" width="330" height="40" rx="6" fill="#1b1916" stroke="#43403a" opacity="0.5"/><text x="216" y="149" fill="#8a8277">case Integer i</text>
    <rect x="200" y="176" width="330" height="40" rx="6" fill="#1b1916" stroke="#43403a" opacity="0.5"/><text x="216" y="201" fill="#8a8277">case String s</text>
    <rect x="200" y="228" width="330" height="40" rx="6" fill="#1b1916" stroke="#43403a" opacity="0.5"/><text x="216" y="253" fill="#8a8277">default</text>
  </g>
  <path d="M120 44 L120 92 L196 92" stroke="#ff7a1a" stroke-width="1.8" fill="none" marker-end="url(#s)"/>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12.5">
    <text x="548" y="45" fill="#8a8277">não casa</text>
    <text x="548" y="90" fill="#4fd68b">tipo bate e a guarda</text>
    <text x="548" y="106" fill="#4fd68b">é verdadeira: vence</text>
    <text x="548" y="201" fill="#8a8277">nem são testados</text>
  </g>
  <text x="30" y="285" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#bdb5aa">De cima para baixo, o primeiro que casa vence. Por isso o específico vem antes do geral,</text>
  <text x="30" y="302" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#bdb5aa">e a guarda antes do mesmo tipo sem guarda.</text>
</svg>
