<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t">
  <title id="t">Como o Flyway decide o que aplicar: à esquerda, os arquivos de migração do projeto, V1, V2 e V3; à direita, a tabela flyway_schema_history do banco, com V1 e V2 já aplicadas e os seus checksums; o Flyway primeiro confere se o checksum de cada arquivo aplicado bate com o do banco, e falha se algum mudou; depois aplica, em ordem, as versões que faltam, aqui só a V3, e anota uma linha nova no histórico</title>
  <rect width="760" height="330" fill="#13110f"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/></marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4fd68b"/></marker>
  </defs>
  <text x="20" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#bdb5aa">No projeto: db/migration</text>
  <text x="440" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#bdb5aa">No banco: flyway_schema_history</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="11">
    <rect x="20" y="44" width="260" height="40" rx="6" fill="#1b1916" stroke="#8a8277"/>
    <text x="32" y="68" fill="#f3eee7">V1__criar_tabelas.sql</text>
    <rect x="20" y="96" width="260" height="40" rx="6" fill="#1b1916" stroke="#8a8277"/>
    <text x="32" y="120" fill="#f3eee7">V2__criar_tags.sql</text>
    <rect x="20" y="148" width="260" height="40" rx="6" fill="#13221a" stroke="#4fd68b"/>
    <text x="32" y="172" fill="#4fd68b">V3__adicionar_email.sql</text>

    <rect x="440" y="44" width="300" height="144" rx="6" fill="#1b1916" stroke="#8a8277"/>
    <text x="452" y="64" fill="#6b645b">version</text>
    <text x="530" y="64" fill="#6b645b">checksum</text>
    <text x="640" y="64" fill="#6b645b">success</text>
    <text x="452" y="88" fill="#f3eee7">1</text>
    <text x="530" y="88" fill="#f2c75c">904878999</text>
    <text x="640" y="88" fill="#bdb5aa">true</text>
    <text x="452" y="120" fill="#f3eee7">2</text>
    <text x="530" y="120" fill="#f2c75c">-349610853</text>
    <text x="640" y="120" fill="#bdb5aa">true</text>
    <text x="452" y="172" fill="#4fd68b">3</text>
    <text x="530" y="172" fill="#4fd68b">1773768441</text>
    <text x="640" y="172" fill="#4fd68b">true</text>
  </g>
  <g stroke-width="1.5" fill="none">
    <path d="M280 64 L437 84" stroke="#8a8277" stroke-dasharray="4 4" marker-end="url(#a)"/>
    <path d="M280 116 L437 116" stroke="#8a8277" stroke-dasharray="4 4" marker-end="url(#a)"/>
    <path d="M280 168 L437 168" stroke="#4fd68b" marker-end="url(#v)"/>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="11">
    <text x="300" y="66" fill="#8a8277">confere o checksum</text>
    <text x="300" y="110" fill="#8a8277">confere o checksum</text>
    <text x="300" y="160" fill="#4fd68b">aplica e anota</text>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12">
    <rect x="20" y="214" width="350" height="76" rx="8" fill="#26170c" stroke="#ff7a1a"/>
    <text x="34" y="238" fill="#ff7a1a" font-weight="700">1. Validar</text>
    <text x="34" y="258" fill="#bdb5aa">Arquivo aplicado com checksum diferente:</text>
    <text x="34" y="276" fill="#bdb5aa">a aplicação não sobe.</text>
    <rect x="390" y="214" width="350" height="76" rx="8" fill="#13221a" stroke="#4fd68b"/>
    <text x="404" y="238" fill="#4fd68b" font-weight="700">2. Migrar</text>
    <text x="404" y="258" fill="#bdb5aa">Versões maiores que a atual, em ordem</text>
    <text x="404" y="276" fill="#bdb5aa">numérica, cada uma com a sua linha.</text>
  </g>
  <text x="20" y="314" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">O banco guarda o que já rodou; o projeto guarda o que deveria ter rodado. O Flyway compara os dois.</text>
</svg>
