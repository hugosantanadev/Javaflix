<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="t">
  <title id="t">Os três níveis de não pode mudar: a lista base, um ArrayList com a e b; Collections.unmodifiableList é uma visão que aponta para a base e enxerga quando ela ganha c; List.copyOf tem o próprio array com a e b e não muda; List.of cria uma lista imutável nova, sem origem; as três recusam add com UnsupportedOperationException, e nenhuma impede que um elemento mutável mude por dentro</title>
  <rect width="760" height="320" fill="#13110f"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/></marker>
  </defs>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="12">
    <rect x="20" y="30" width="190" height="70" rx="8" fill="#1b1916" stroke="#8a8277"/>
    <text x="34" y="54" fill="#f3eee7" font-weight="700">base (ArrayList)</text>
    <text x="34" y="78" fill="#bdb5aa">[a, b] + add("c")</text>

    <rect x="290" y="30" width="210" height="70" rx="8" fill="#26170c" stroke="#ff7a1a" stroke-dasharray="5 4"/>
    <text x="304" y="54" fill="#ff7a1a" font-weight="700">unmodifiableList</text>
    <text x="304" y="78" fill="#bdb5aa">visão: vê [a, b, c]</text>

    <rect x="290" y="130" width="210" height="70" rx="8" fill="#13221a" stroke="#4fd68b"/>
    <text x="304" y="154" fill="#4fd68b" font-weight="700">List.copyOf(base)</text>
    <text x="304" y="178" fill="#bdb5aa">cópia: fica [a, b]</text>

    <rect x="560" y="130" width="180" height="70" rx="8" fill="#13221a" stroke="#4fd68b"/>
    <text x="574" y="154" fill="#4fd68b" font-weight="700">List.of(a, b)</text>
    <text x="574" y="178" fill="#bdb5aa">nova, sem origem</text>
  </g>
  <g stroke-width="1.5" fill="none">
    <path d="M287 65 L213 65" stroke="#ff7a1a" marker-end="url(#a)"/>
    <path d="M210 90 C 250 100, 250 165, 287 165" stroke="#8a8277" stroke-dasharray="4 3" marker-end="url(#a)"/>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#8a8277">
    <text x="222" y="58">aponta</text>
    <text x="214" y="140">copiou</text>
    <text x="214" y="154">uma vez</text>
  </g>
  <text x="530" y="58" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#bdb5aa">add em qualquer uma das três:</text>
  <text x="530" y="76" font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#db5c5c">UnsupportedOperationException</text>

  <rect x="20" y="230" width="720" height="50" rx="8" fill="#1b1916" stroke="#2b2824"/>
  <text x="34" y="252" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#f3eee7">List.of(new StringBuilder("x")).get(0).append("y")</text>
  <text x="34" y="270" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#f2c75c">funciona: a lista é imutável, o StringBuilder dentro dela não</text>
  <text x="20" y="306" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">Imutável de verdade só quando a coleção e os elementos não mudam.</text>
</svg>
