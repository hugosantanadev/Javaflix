<svg xmlns="http://www.w3.org/2000/svg" width="760" height="306" viewBox="0 0 760 306" role="img" aria-labelledby="t">
  <title id="t">Editor do IntelliJ com a expressão a + b + c selecionada e o popup do Ctrl+Shift+P mostrando que o tipo dela é int</title>
  <rect width="760" height="306" fill="#13110f"/>
  <rect x="16" y="14" width="728" height="278" rx="10" fill="#1e1f22" stroke="#43454a"/>
  <rect x="16" y="14" width="728" height="30" rx="10" fill="#2b2d30"/>
  <rect x="16" y="34" width="728" height="10" fill="#2b2d30"/>
  <rect x="24" y="18" width="124" height="24" rx="4" fill="#1e1f22"/>
  <circle cx="38" cy="30" r="5" fill="#3574f0"/>
  <text x="50" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#dfe1e5">Caracteres.java</text>

  <rect x="288" y="180" width="74" height="19" rx="2" fill="#214283"/>

  <g font-family="Cascadia Code, Consolas, monospace" font-size="13">
    <g fill="#6f737a" text-anchor="end">
      <text x="56" y="74">1</text><text x="56" y="98">2</text><text x="56" y="122">3</text><text x="56" y="146">4</text>
      <text x="56" y="170">5</text><text x="56" y="194">6</text><text x="56" y="218">7</text><text x="56" y="242">8</text>
    </g>
    <text x="80" y="74"><tspan fill="#cf8e6d">public class</tspan><tspan fill="#bcbec4"> Caracteres {</tspan></text>
    <text x="111" y="98"><tspan fill="#cf8e6d">public static void</tspan><tspan fill="#56a8f5"> main</tspan><tspan fill="#bcbec4">(String[] args) {</tspan></text>
    <text x="142" y="122"><tspan fill="#cf8e6d">char</tspan><tspan fill="#bcbec4"> a = </tspan><tspan fill="#6aab73">'A'</tspan><tspan fill="#bcbec4">;</tspan></text>
    <text x="142" y="146"><tspan fill="#cf8e6d">char</tspan><tspan fill="#bcbec4"> b = </tspan><tspan fill="#6aab73">'B'</tspan><tspan fill="#bcbec4">;</tspan></text>
    <text x="142" y="170"><tspan fill="#cf8e6d">char</tspan><tspan fill="#bcbec4"> c = </tspan><tspan fill="#6aab73">'C'</tspan><tspan fill="#bcbec4">;</tspan></text>
    <text x="142" y="194" textLength="146" lengthAdjust="spacingAndGlyphs"><tspan fill="#bcbec4">System.</tspan><tspan fill="#c77dbb" font-style="italic">out</tspan><tspan fill="#bcbec4">.println(</tspan></text>
    <text x="291" y="194" fill="#dfe1e5" textLength="68" lengthAdjust="spacingAndGlyphs">a + b + c</text>
    <text x="364" y="194" fill="#bcbec4">);</text>
    <text x="111" y="218" fill="#bcbec4">}</text>
    <text x="80" y="242" fill="#bcbec4">}</text>
  </g>

  <rect x="288" y="205" width="52" height="26" rx="5" fill="#2b2d30" stroke="#43454a"/>
  <text x="314" y="223" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#cf8e6d">int</text>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1a0b01">
    <circle cx="325" cy="166" r="11" fill="#ff7a1a"/><text x="325" y="170">1</text>
    <circle cx="358" cy="218" r="11" fill="#ff7a1a"/><text x="358" y="222">2</text>
  </g>
  <text x="80" y="274" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#bcbec4">Ctrl + Shift + P mostra o tipo da expressão: <tspan font-family="Cascadia Code, Consolas, monospace">char + char</tspan> dá <tspan font-family="Cascadia Code, Consolas, monospace">int</tspan>.</text>
</svg>
