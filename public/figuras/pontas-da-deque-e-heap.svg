<svg xmlns="http://www.w3.org/2000/svg" width="760" height="336" viewBox="0 0 760 336" role="img" aria-labelledby="t">
  <title id="t">Em cima, uma Deque com os elementos 4, 2, 1, 3 e 5: no começo atuam push, pop, peek, offerFirst e pollFirst; no fim atuam offer, offerLast, pollLast e peekLast; embaixo, a PriorityQueue com o array 1, 2, 4, 5, 3 desenhada como árvore: o 1 na raiz, 2 e 4 como filhos, 5 e 3 como filhos do 2; cada pai é menor que os filhos, mas o array não está ordenado</title>
  <rect width="760" height="336" fill="#13110f"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/></marker>
  </defs>
  <text x="20" y="26" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#bdb5aa">Deque: as duas pontas</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="13">
    <rect x="240" y="40" width="56" height="40" fill="#26170c" stroke="#ff7a1a"/><text x="263" y="65" fill="#f3eee7">4</text>
    <rect x="296" y="40" width="56" height="40" fill="#1b1916" stroke="#8a8277"/><text x="319" y="65" fill="#f3eee7">2</text>
    <rect x="352" y="40" width="56" height="40" fill="#1b1916" stroke="#8a8277"/><text x="375" y="65" fill="#f3eee7">1</text>
    <rect x="408" y="40" width="56" height="40" fill="#1b1916" stroke="#8a8277"/><text x="431" y="65" fill="#f3eee7">3</text>
    <rect x="464" y="40" width="56" height="40" fill="#13221a" stroke="#4fd68b"/><text x="487" y="65" fill="#f3eee7">5</text>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="11">
    <text x="20" y="52" fill="#ff7a1a">começo</text>
    <text x="20" y="70" fill="#bdb5aa">push, pop, peek</text>
    <text x="20" y="86" fill="#bdb5aa">offerFirst, pollFirst</text>
    <text x="560" y="52" fill="#4fd68b">fim</text>
    <text x="560" y="70" fill="#bdb5aa">offer, offerLast</text>
    <text x="560" y="86" fill="#bdb5aa">pollLast, peekLast</text>
  </g>
  <g stroke-width="1.5" fill="none">
    <path d="M196 60 L236 60" stroke="#ff7a1a" marker-end="url(#a)"/>
    <path d="M550 60 L524 60" stroke="#4fd68b" marker-end="url(#a)"/>
  </g>
  <text x="240" y="100" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#8a8277">poll tira do começo: numa fila, entra pelo fim com offer</text>

  <text x="20" y="140" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#bdb5aa">PriorityQueue: um heap guardado num array</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="12">
    <rect x="20" y="156" width="40" height="32" fill="#13221a" stroke="#4fd68b"/><text x="36" y="177" fill="#f3eee7">1</text>
    <rect x="60" y="156" width="40" height="32" fill="#1b1916" stroke="#8a8277"/><text x="76" y="177" fill="#f3eee7">2</text>
    <rect x="100" y="156" width="40" height="32" fill="#1b1916" stroke="#8a8277"/><text x="116" y="177" fill="#f3eee7">4</text>
    <rect x="140" y="156" width="40" height="32" fill="#1b1916" stroke="#8a8277"/><text x="156" y="177" fill="#f3eee7">5</text>
    <rect x="180" y="156" width="40" height="32" fill="#1b1916" stroke="#8a8277"/><text x="196" y="177" fill="#f3eee7">3</text>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="10" fill="#6b645b">
    <text x="36" y="204">0</text><text x="76" y="204">1</text><text x="116" y="204">2</text><text x="156" y="204">3</text><text x="196" y="204">4</text>
  </g>
  <text x="20" y="232" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#8a8277">filhos de i: 2i + 1 e 2i + 2</text>

  <g stroke="#8a8277" stroke-width="1.5">
    <path d="M500 182 L440 232"/>
    <path d="M500 182 L560 232"/>
    <path d="M440 232 L400 282"/>
    <path d="M440 232 L480 282"/>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="13">
    <circle cx="500" cy="174" r="18" fill="#13221a" stroke="#4fd68b"/><text x="496" y="179" fill="#f3eee7">1</text>
    <circle cx="440" cy="232" r="18" fill="#1b1916" stroke="#8a8277"/><text x="436" y="237" fill="#f3eee7">2</text>
    <circle cx="560" cy="232" r="18" fill="#1b1916" stroke="#8a8277"/><text x="556" y="237" fill="#f3eee7">4</text>
    <circle cx="400" cy="290" r="18" fill="#1b1916" stroke="#8a8277"/><text x="396" y="295" fill="#f3eee7">5</text>
    <circle cx="480" cy="290" r="18" fill="#1b1916" stroke="#8a8277"/><text x="476" y="295" fill="#f3eee7">3</text>
  </g>
  <text x="600" y="174" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#4fd68b">peek e poll: a raiz</text>
  <text x="20" y="324" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">Todo pai é menor que os filhos; a raiz é o menor, mas o array não está ordenado.</text>
</svg>
