<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="t">
  <title id="t">A visão devolvida por reversed: a lista original 1, 2, 3 e a visão inversa 3, 2, 1 apontam para os mesmos elementos; a posição 0 da visão é o último da original; set na posição 0 da visão troca o último da original, addFirst na visão acrescenta no fim da original, e removeLast na visão remove o primeiro da original</title>
  <rect width="760" height="320" fill="#13110f"/>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700">
    <text x="20" y="40" fill="#bdb5aa">original</text>
    <text x="20" y="150" fill="#ff7a1a">l.reversed()</text>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="14">
    <rect x="140" y="20" width="70" height="36" fill="#1b1916" stroke="#8a8277"/><text x="170" y="44" fill="#f3eee7">1</text>
    <rect x="210" y="20" width="70" height="36" fill="#1b1916" stroke="#8a8277"/><text x="240" y="44" fill="#f3eee7">2</text>
    <rect x="280" y="20" width="70" height="36" fill="#1b1916" stroke="#8a8277"/><text x="310" y="44" fill="#f3eee7">3</text>
    <rect x="140" y="130" width="70" height="36" fill="#26170c" stroke="#ff7a1a"/><text x="170" y="154" fill="#f3eee7">3</text>
    <rect x="210" y="130" width="70" height="36" fill="#26170c" stroke="#ff7a1a"/><text x="240" y="154" fill="#f3eee7">2</text>
    <rect x="280" y="130" width="70" height="36" fill="#26170c" stroke="#ff7a1a"/><text x="310" y="154" fill="#f3eee7">1</text>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="10" fill="#6b645b">
    <text x="172" y="72">0</text><text x="242" y="72">1</text><text x="312" y="72">2</text>
    <text x="172" y="182">0</text><text x="242" y="182">1</text><text x="312" y="182">2</text>
  </g>
  <g stroke="#8a8277" stroke-width="1.2" stroke-dasharray="4 3" fill="none">
    <path d="M315 78 L175 126"/>
    <path d="M245 78 L245 126"/>
    <path d="M175 78 L315 126"/>
  </g>
  <text x="380" y="92" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">os mesmos elementos, sem cópia</text>

  <g font-family="Cascadia Code, Consolas, monospace" font-size="12">
    <text x="20" y="222" fill="#f3eee7">inversa.set(0, x)</text>
    <text x="20" y="248" fill="#f3eee7">inversa.addFirst(x)</text>
    <text x="20" y="274" fill="#f3eee7">inversa.removeLast()</text>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12">
    <text x="240" y="222" fill="#ff7a1a">troca o último da original</text>
    <text x="240" y="248" fill="#ff7a1a">acrescenta no fim da original</text>
    <text x="240" y="274" fill="#ff7a1a">remove o primeiro da original</text>
  </g>
  <text x="20" y="308" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">Para uma cópia independente: new ArrayList&lt;&gt;(l.reversed()).</text>
</svg>
