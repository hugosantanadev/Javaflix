<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t">
  <title id="t">O mesmo código com dois if aninhados e um else, sem chaves: a indentação sugere que o else é do primeiro if, mas o compilador o liga ao if mais próximo, o segundo</title>
  <rect width="760" height="300" fill="#13110f"/>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.2">
    <text x="30" y="34" fill="#db5c5c">O QUE A INDENTAÇÃO SUGERE</text>
    <text x="400" y="34" fill="#4fd68b">O QUE O COMPILADOR ENTENDE</text>
  </g>
  <line x1="380" y1="20" x2="380" y2="270" stroke="#2b2824"/>

  <g font-family="Cascadia Code, Consolas, monospace" font-size="14">
    <text x="60" y="84"><tspan fill="#cf8e6d">if</tspan><tspan fill="#bcbec4"> (a &gt; 0)</tspan></text>
    <text x="92" y="114"><tspan fill="#cf8e6d">if</tspan><tspan fill="#bcbec4"> (b &gt; 0)</tspan></text>
    <text x="124" y="144" fill="#bcbec4">println("dois positivos");</text>
    <text x="60" y="174" fill="#cf8e6d">else</text>
    <text x="92" y="204" fill="#bcbec4">println("qual else?");</text>

    <text x="430" y="84"><tspan fill="#cf8e6d">if</tspan><tspan fill="#bcbec4"> (a &gt; 0)</tspan></text>
    <text x="462" y="114"><tspan fill="#cf8e6d">if</tspan><tspan fill="#bcbec4"> (b &gt; 0)</tspan></text>
    <text x="494" y="144" fill="#bcbec4">println("dois positivos");</text>
    <text x="462" y="174" fill="#cf8e6d">else</text>
    <text x="494" y="204" fill="#bcbec4">println("qual else?");</text>
  </g>

  <path d="M52 78 C 30 100, 30 150, 52 170" fill="none" stroke="#db5c5c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="18" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#db5c5c">?</text>

  <path d="M454 108 C 436 128, 436 152, 454 170" fill="none" stroke="#4fd68b" stroke-width="2"/>
  <path d="M422 78 C 404 120, 404 190, 422 206" fill="none" stroke="#4fd68b" stroke-width="1.4" stroke-dasharray="3 3"/>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#bdb5aa">
    <text x="30" y="246">Parece um else do if (a &gt; 0).</text>
    <text x="400" y="240">O else é do if mais próximo sem else. Todo o</text>
    <text x="400" y="258">resto é o corpo único do if (a &gt; 0).</text>
  </g>
  <text x="30" y="290" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#bdb5aa">Com chaves em todo if, a dúvida não existe: as chaves dizem ao compilador o que a indentação só sugere.</text>
</svg>
