<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t">
  <title id="t">As quatro famílias de java.util.function: Supplier não recebe nada e devolve T, com get; Consumer recebe T e não devolve nada, com accept; Predicate recebe T e devolve boolean, com test; Function recebe T e devolve R, com apply; embaixo, a regra de nomes dos primitivos: Int no começo recebe int, como IntFunction, com apply; To no começo devolve primitivo, como ToIntFunction, com applyAsInt; Obj e Int Consumer recebe um objeto e um int</title>
  <rect width="760" height="330" fill="#13110f"/>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="12">
    <rect x="20" y="20" width="170" height="110" rx="8" fill="#1b1916" stroke="#ff7a1a"/>
    <text x="34" y="44" fill="#ff7a1a" font-weight="700">Supplier&lt;T&gt;</text>
    <text x="34" y="72" fill="#f3eee7">() → T</text>
    <text x="34" y="100" fill="#bdb5aa">get()</text>

    <rect x="203" y="20" width="170" height="110" rx="8" fill="#1b1916" stroke="#4fd68b"/>
    <text x="217" y="44" fill="#4fd68b" font-weight="700">Consumer&lt;T&gt;</text>
    <text x="217" y="72" fill="#f3eee7">T → nada</text>
    <text x="217" y="100" fill="#bdb5aa">accept(T)</text>

    <rect x="386" y="20" width="170" height="110" rx="8" fill="#1b1916" stroke="#f2c75c"/>
    <text x="400" y="44" fill="#f2c75c" font-weight="700">Predicate&lt;T&gt;</text>
    <text x="400" y="72" fill="#f3eee7">T → boolean</text>
    <text x="400" y="100" fill="#bdb5aa">test(T)</text>

    <rect x="569" y="20" width="171" height="110" rx="8" fill="#1b1916" stroke="#bdb5aa"/>
    <text x="583" y="44" fill="#f3eee7" font-weight="700">Function&lt;T, R&gt;</text>
    <text x="583" y="72" fill="#f3eee7">T → R</text>
    <text x="583" y="100" fill="#bdb5aa">apply(T)</text>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#8a8277">
    <text x="34" y="122">sem versão Bi</text>
    <text x="217" y="122">BiConsumer</text>
    <text x="400" y="122">BiPredicate</text>
    <text x="583" y="122">BiFunction, operadores</text>
  </g>
  <text x="20" y="168" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#bdb5aa">A regra de nomes dos primitivos</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="12">
    <rect x="20" y="180" width="230" height="80" rx="6" fill="#1b1916" stroke="#8a8277"/>
    <text x="34" y="204" fill="#ff7a1a">Int...</text>
    <text x="34" y="226" fill="#f3eee7">IntFunction&lt;R&gt;</text>
    <text x="34" y="248" fill="#bdb5aa">recebe int: apply</text>

    <rect x="265" y="180" width="230" height="80" rx="6" fill="#1b1916" stroke="#8a8277"/>
    <text x="279" y="204" fill="#4fd68b">To...</text>
    <text x="279" y="226" fill="#f3eee7">ToIntFunction&lt;T&gt;</text>
    <text x="279" y="248" fill="#bdb5aa">devolve int: applyAsInt</text>

    <rect x="510" y="180" width="230" height="80" rx="6" fill="#1b1916" stroke="#8a8277"/>
    <text x="524" y="204" fill="#f2c75c">Obj...Consumer</text>
    <text x="524" y="226" fill="#f3eee7">ObjIntConsumer&lt;T&gt;</text>
    <text x="524" y="248" fill="#bdb5aa">recebe T e int: accept</text>
  </g>
  <text x="20" y="298" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">Devolve primitivo? O método ganha As mais o tipo: getAsInt, applyAsLong, applyAsDouble.</text>
</svg>
