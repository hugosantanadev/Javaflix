<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t">
  <title id="t">O grafo de amigos visto em camadas pela busca em largura a partir de Ana. Na camada 0 está Ana; na camada 1, Bia e Caio; na camada 2, Duda e Edu; na camada 3, Fabi. O caminho mais curto de Ana até Fabi, Ana, Bia, Duda, Fabi, está destacado e tem 3 arestas</title>
  <rect width="760" height="300" fill="#13110f"/>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277" text-anchor="middle">
    <text x="90" y="34">camada 0</text><text x="280" y="34">camada 1</text><text x="470" y="34">camada 2</text><text x="660" y="34">camada 3</text>
  </g>
  <g stroke="#43403a" stroke-width="1.5" stroke-dasharray="4 4"><path d="M185 45 L185 260"/><path d="M375 45 L375 260"/><path d="M565 45 L565 260"/></g>
  <g stroke="#bdb5aa" stroke-width="1.5">
    <path d="M90 150 L280 90"/><path d="M90 150 L280 210"/><path d="M280 90 L470 90"/><path d="M280 210 L470 90"/><path d="M280 210 L470 210"/><path d="M470 90 L660 150"/><path d="M470 210 L660 150"/>
  </g>
  <g stroke="#4fd68b" stroke-width="3.5"><path d="M90 150 L280 90"/><path d="M280 90 L470 90"/><path d="M470 90 L660 150"/></g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13" text-anchor="middle">
    <g fill="#1b1916" stroke="#ff7a1a" stroke-width="2"><circle cx="90" cy="150" r="30"/></g>
    <g fill="#1b1916" stroke="#bdb5aa"><circle cx="280" cy="90" r="28"/><circle cx="280" cy="210" r="28"/><circle cx="470" cy="90" r="28"/><circle cx="470" cy="210" r="28"/></g>
    <g fill="#1b1916" stroke="#4fd68b" stroke-width="2"><circle cx="660" cy="150" r="28"/></g>
    <g fill="#f3eee7"><text x="90" y="155">Ana</text><text x="280" y="95">Bia</text><text x="280" y="215">Caio</text><text x="470" y="95">Duda</text><text x="470" y="215">Edu</text><text x="660" y="155">Fabi</text></g>
  </g>
  <text x="40" y="288" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#bdb5aa">A fila garante as camadas em ordem; o primeiro caminho que chega a Fabi (verde) é o mais curto: 3 arestas.</text>
</svg>
