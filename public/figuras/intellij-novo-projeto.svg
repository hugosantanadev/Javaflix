<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="t">
  <title id="t">Janela New Project do IntelliJ IDEA, com os campos Name, Build system, JDK e Add sample code marcados de 1 a 4</title>
  <rect width="760" height="430" fill="#13110f"/>
  <rect x="30" y="20" width="700" height="390" rx="10" fill="#2b2d30" stroke="#43454a"/>
  <rect x="30" y="20" width="700" height="34" rx="10" fill="#2b2d30"/>
  <text x="380" y="42" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#dfe1e5">New Project</text>
  <line x1="30" y1="54" x2="730" y2="54" stroke="#43454a"/>

  <rect x="30" y="54" width="170" height="356" fill="#26282b"/>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12.5">
    <rect x="40" y="66" width="150" height="24" rx="4" fill="#2e436e"/>
    <text x="52" y="82" fill="#dfe1e5">New Project</text>
    <text x="52" y="108" fill="#bcbec4">Empty Project</text>
    <text x="52" y="140" fill="#6f737a" font-size="11">Generators</text>
    <text x="52" y="162" fill="#bcbec4">Maven Archetype</text>
    <text x="52" y="184" fill="#bcbec4">Jakarta EE</text>
    <text x="52" y="206" fill="#bcbec4">Spring Boot</text>
    <text x="52" y="228" fill="#bcbec4">JavaFX</text>
  </g>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#bcbec4">
    <text x="226" y="86">Name:</text>
    <rect x="330" y="70" width="360" height="26" rx="4" fill="#1e1f22" stroke="#548af7"/>
    <text x="340" y="88" fill="#dfe1e5" font-family="Cascadia Code, Consolas, monospace" font-size="12">javaflix</text>

    <text x="226" y="126">Location:</text>
    <rect x="330" y="110" width="360" height="26" rx="4" fill="#1e1f22" stroke="#43454a"/>
    <text x="340" y="128" fill="#dfe1e5" font-family="Cascadia Code, Consolas, monospace" font-size="12">~\IdeaProjects</text>

    <rect x="330" y="148" width="14" height="14" rx="3" fill="none" stroke="#6f737a"/>
    <text x="352" y="160">Create Git repository</text>

    <text x="226" y="194">Language:</text>
    <rect x="330" y="178" width="64" height="26" rx="4" fill="#2e436e" stroke="#548af7"/>
    <text x="362" y="196" text-anchor="middle" fill="#dfe1e5">Java</text>
    <rect x="400" y="178" width="64" height="26" rx="4" fill="#1e1f22" stroke="#43454a"/>
    <text x="432" y="196" text-anchor="middle">Kotlin</text>
    <rect x="470" y="178" width="70" height="26" rx="4" fill="#1e1f22" stroke="#43454a"/>
    <text x="505" y="196" text-anchor="middle">Groovy</text>

    <text x="226" y="234">Build system:</text>
    <rect x="330" y="218" width="76" height="26" rx="4" fill="#2e436e" stroke="#548af7"/>
    <text x="368" y="236" text-anchor="middle" fill="#dfe1e5">IntelliJ</text>
    <rect x="412" y="218" width="70" height="26" rx="4" fill="#1e1f22" stroke="#43454a"/>
    <text x="447" y="236" text-anchor="middle">Maven</text>
    <rect x="488" y="218" width="70" height="26" rx="4" fill="#1e1f22" stroke="#43454a"/>
    <text x="523" y="236" text-anchor="middle">Gradle</text>

    <text x="226" y="274">JDK:</text>
    <rect x="330" y="258" width="360" height="26" rx="4" fill="#1e1f22" stroke="#43454a"/>
    <text x="340" y="276" fill="#dfe1e5">25  Oracle OpenJDK 25</text>
    <path d="M674 268 l5 6 l5 -6" fill="none" stroke="#bcbec4" stroke-width="1.5"/>

    <rect x="330" y="300" width="14" height="14" rx="3" fill="#548af7"/>
    <path d="M333 307 l3 3 l6 -7" fill="none" stroke="#ffffff" stroke-width="1.8"/>
    <text x="352" y="312">Add sample code</text>
  </g>

  <rect x="604" y="364" width="96" height="30" rx="4" fill="#3574f0"/>
  <text x="652" y="384" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#ffffff">Create</text>
  <rect x="500" y="364" width="96" height="30" rx="4" fill="none" stroke="#43454a"/>
  <text x="548" y="384" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#bcbec4">Cancel</text>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1a0b01">
    <circle cx="710" cy="83" r="11" fill="#ff7a1a"/><text x="710" y="87">1</text>
    <circle cx="578" cy="231" r="11" fill="#ff7a1a"/><text x="578" y="235">2</text>
    <circle cx="710" cy="271" r="11" fill="#ff7a1a"/><text x="710" y="275">3</text>
    <circle cx="470" cy="307" r="11" fill="#ff7a1a"/><text x="470" y="311">4</text>
  </g>
</svg>
