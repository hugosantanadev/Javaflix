<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" role="img" aria-labelledby="t">
  <title id="t">O int 0x12345678 gravado nos endereços 100 a 103 de dois jeitos. Em big-endian, usado na rede e no arquivo .class, os bytes ficam 12, 34, 56, 78, com o mais significativo primeiro. Em little-endian, usado por x86 e ARM, ficam 78, 56, 34, 12, com o menos significativo primeiro</title>
  <rect width="760" height="270" fill="#13110f"/>
  <text x="380" y="34" font-family="Cascadia Code, Consolas, monospace" font-size="16" font-weight="700" fill="#f3eee7" text-anchor="middle">int x = 0x12345678;</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#8a8277" text-anchor="middle">
    <text x="295" y="62">100</text><text x="375" y="62">101</text><text x="455" y="62">102</text><text x="535" y="62">103</text>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#bdb5aa">
    <text x="30" y="104">big-endian</text><text x="30" y="122" font-size="11.5" fill="#8a8277">rede, .class, ByteBuffer</text>
    <text x="30" y="184">little-endian</text><text x="30" y="202" font-size="11.5" fill="#8a8277">x86, ARM</text>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="20" font-weight="700" text-anchor="middle">
    <rect x="255" y="80" width="80" height="54" fill="#1b1916" stroke="#ff7a1a"/><text x="295" y="115" fill="#ff7a1a">12</text>
    <rect x="335" y="80" width="80" height="54" fill="#1b1916" stroke="#43403a"/><text x="375" y="115" fill="#f3eee7">34</text>
    <rect x="415" y="80" width="80" height="54" fill="#1b1916" stroke="#43403a"/><text x="455" y="115" fill="#f3eee7">56</text>
    <rect x="495" y="80" width="80" height="54" fill="#1b1916" stroke="#4fd68b"/><text x="535" y="115" fill="#4fd68b">78</text>
    <rect x="255" y="160" width="80" height="54" fill="#1b1916" stroke="#4fd68b"/><text x="295" y="195" fill="#4fd68b">78</text>
    <rect x="335" y="160" width="80" height="54" fill="#1b1916" stroke="#43403a"/><text x="375" y="195" fill="#f3eee7">56</text>
    <rect x="415" y="160" width="80" height="54" fill="#1b1916" stroke="#43403a"/><text x="455" y="195" fill="#f3eee7">34</text>
    <rect x="495" y="160" width="80" height="54" fill="#1b1916" stroke="#ff7a1a"/><text x="535" y="195" fill="#ff7a1a">12</text>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#bdb5aa">
    <text x="600" y="104"><tspan fill="#ff7a1a">12</tspan>: mais significativo</text>
    <text x="600" y="184"><tspan fill="#4fd68b">78</tspan>: menos significativo</text>
  </g>
  <text x="30" y="254" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#bdb5aa">Mesmo número, mesmos bytes, ordem diferente. Ler com a ordem errada dá 0x78563412.</text>
</svg>
