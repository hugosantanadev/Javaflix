<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="t">
  <title id="t">Como o merge do Map decide, numa chamada merge de chave, valor e função: se a chave está ausente ou com valor null, insere o valor recebido; se está presente, chama a função com o valor antigo e o novo; se a função devolve null, a chave é removida; se devolve outro valor, ele substitui o antigo; embaixo, a contagem de o rato roeu o rato com merge de palavra, 1 e Integer::sum</title>
  <rect width="760" height="320" fill="#13110f"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/></marker>
  </defs>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="12">
    <rect x="20" y="30" width="200" height="44" rx="6" fill="#1b1916" stroke="#8a8277"/>
    <text x="34" y="57" fill="#f3eee7">merge(k, v, f)</text>

    <rect x="270" y="30" width="200" height="44" rx="6" fill="#1b1916" stroke="#f2c75c"/>
    <text x="284" y="51" fill="#f2c75c">k ausente ou com</text>
    <text x="284" y="67" fill="#f2c75c">valor null?</text>

    <rect x="520" y="30" width="220" height="44" rx="6" fill="#13221a" stroke="#4fd68b"/>
    <text x="534" y="57" fill="#4fd68b">insere v</text>

    <rect x="270" y="120" width="200" height="44" rx="6" fill="#1b1916" stroke="#8a8277"/>
    <text x="284" y="141" fill="#f3eee7">r = f(antigo, v)</text>
    <text x="284" y="157" fill="#bdb5aa">chama a função</text>

    <rect x="270" y="210" width="200" height="44" rx="6" fill="#1b1916" stroke="#f2c75c"/>
    <text x="284" y="237" fill="#f2c75c">r é null?</text>

    <rect x="520" y="182" width="220" height="40" rx="6" fill="#2a1414" stroke="#db5c5c"/>
    <text x="534" y="207" fill="#db5c5c">remove a chave k</text>
    <rect x="520" y="242" width="220" height="40" rx="6" fill="#13221a" stroke="#4fd68b"/>
    <text x="534" y="267" fill="#4fd68b">k passa a valer r</text>
  </g>
  <g stroke="#8a8277" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M220 52 L267 52"/>
    <path d="M470 52 L517 52"/>
    <path d="M370 74 L370 117"/>
    <path d="M370 164 L370 207"/>
    <path d="M470 226 L517 204"/>
    <path d="M470 238 L517 260"/>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#8a8277">
    <text x="482" y="44">sim</text>
    <text x="378" y="100">não</text>
    <text x="482" y="206">sim</text>
    <text x="482" y="262">não</text>
  </g>
  <text x="20" y="130" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#bdb5aa">O contador clássico</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="11">
    <text x="20" y="152" fill="#bdb5aa">merge(p, 1, Integer::sum)</text>
    <text x="20" y="176" fill="#f3eee7" xml:space="preserve">"o"    → insere 1</text>
    <text x="20" y="196" fill="#f3eee7">"rato" → insere 1</text>
    <text x="20" y="216" fill="#f3eee7">"roeu" → insere 1</text>
    <text x="20" y="236" fill="#f3eee7" xml:space="preserve">"o"    → 1 + 1 = 2</text>
    <text x="20" y="256" fill="#f3eee7">"rato" → 1 + 1 = 2</text>
  </g>
  <text x="20" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">compute e computeIfPresent seguem a mesma regra: função que devolve null remove a chave.</text>
</svg>
