<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t">
  <title id="t">Duas expressões desenhadas como árvores: em 2 + 3 * 4 a multiplicação fica embaixo e é feita antes, dando 14; em 10 - 4 - 3 a subtração da esquerda fica embaixo, dando 3</title>
  <rect width="760" height="330" fill="#13110f"/>
  <line x1="380" y1="20" x2="380" y2="300" stroke="#2b2824"/>

  <g font-family="Cascadia Code, Consolas, monospace" font-size="17" font-weight="700" fill="#f3eee7" text-anchor="middle">
    <text x="190" y="34">2 + 3 * 4</text>
    <text x="570" y="34">10 - 4 - 3</text>
  </g>

  <g stroke="#43403a" stroke-width="2">
    <line x1="190" y1="80" x2="110" y2="160"/><line x1="190" y1="80" x2="270" y2="160"/>
    <line x1="270" y1="160" x2="220" y2="246"/><line x1="270" y1="160" x2="320" y2="246"/>
    <line x1="570" y1="80" x2="490" y2="160"/><line x1="570" y1="80" x2="650" y2="160"/>
    <line x1="490" y1="160" x2="430" y2="246"/><line x1="490" y1="160" x2="550" y2="246"/>
  </g>

  <g font-family="Cascadia Code, Consolas, monospace" font-size="18" font-weight="700" text-anchor="middle">
    <circle cx="190" cy="80" r="24" fill="#3a1d07" stroke="#ff7a1a" stroke-width="1.6"/><text x="190" y="86" fill="#ff9447">+</text>
    <circle cx="270" cy="160" r="24" fill="#3a1d07" stroke="#ff7a1a" stroke-width="1.6"/><text x="270" y="166" fill="#ff9447">*</text>
    <circle cx="110" cy="160" r="22" fill="#1b1916" stroke="#43403a"/><text x="110" y="166" fill="#f3eee7">2</text>
    <circle cx="220" cy="246" r="22" fill="#1b1916" stroke="#43403a"/><text x="220" y="252" fill="#f3eee7">3</text>
    <circle cx="320" cy="246" r="22" fill="#1b1916" stroke="#43403a"/><text x="320" y="252" fill="#f3eee7">4</text>

    <circle cx="570" cy="80" r="24" fill="#3a1d07" stroke="#ff7a1a" stroke-width="1.6"/><text x="570" y="86" fill="#ff9447">-</text>
    <circle cx="490" cy="160" r="24" fill="#3a1d07" stroke="#ff7a1a" stroke-width="1.6"/><text x="490" y="166" fill="#ff9447">-</text>
    <circle cx="650" cy="160" r="22" fill="#1b1916" stroke="#43403a"/><text x="650" y="166" fill="#f3eee7">3</text>
    <circle cx="430" cy="246" r="22" fill="#1b1916" stroke="#43403a"/><text x="430" y="252" fill="#f3eee7">10</text>
    <circle cx="550" cy="246" r="22" fill="#1b1916" stroke="#43403a"/><text x="550" y="252" fill="#f3eee7">4</text>
  </g>

  <g font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#f2c75c">
    <text x="304" y="152">= 12</text>
    <text x="224" y="74">= 14</text>
    <text x="414" y="152" text-anchor="end">= 6</text>
    <text x="604" y="74">= 3</text>
  </g>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#bdb5aa">
    <text x="30" y="296">Precedência: o * fica mais fundo na árvore,</text>
    <text x="30" y="314">então é calculado antes do +.</text>
    <text x="410" y="296">Associatividade: no mesmo nível, o da</text>
    <text x="410" y="314">esquerda fica mais fundo: (10 - 4) - 3.</text>
  </g>
</svg>
