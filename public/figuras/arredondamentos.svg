<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="t">
  <title id="t">Arredondamentos na reta numérica: floor vai sempre para a esquerda, ceil para a direita, e round leva o meio para a direita, no sentido do infinito positivo; 2.5 vira 3 e -2.5 vira -2</title>
  <rect width="760" height="320" fill="#13110f"/>
  <defs>
    <marker id="s-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#56a8f5"/></marker>
    <marker id="s-laranja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9447"/></marker>
    <marker id="s-reta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/></marker>
  </defs>

  <line x1="50" y1="160" x2="716" y2="160" stroke="#8a8277" stroke-width="1.6" marker-end="url(#s-reta)"/>
  <g stroke="#8a8277" stroke-width="1.4">
    <line x1="80" y1="152" x2="80" y2="168"/><line x1="180" y1="152" x2="180" y2="168"/><line x1="280" y1="152" x2="280" y2="168"/>
    <line x1="380" y1="150" x2="380" y2="170"/><line x1="480" y1="152" x2="480" y2="168"/><line x1="580" y1="152" x2="580" y2="168"/>
    <line x1="680" y1="152" x2="680" y2="168"/>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#bcbec4" text-anchor="middle">
    <text x="80" y="186">-3</text><text x="180" y="186">-2</text><text x="280" y="186">-1</text><text x="380" y="186">0</text>
    <text x="480" y="186">1</text><text x="580" y="186">2</text><text x="680" y="186">3</text>
  </g>
  <text x="724" y="146" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277" text-anchor="end">+∞</text>

  <!-- 2.5 acima -->
  <circle cx="630" cy="160" r="6" fill="#f2c75c"/>
  <text x="630" y="190" font-family="Cascadia Code, Consolas, monospace" font-size="14" font-weight="700" fill="#f2c75c" text-anchor="middle">2.5</text>
  <path d="M624 150 C 612 100, 594 100, 582 150" stroke="#56a8f5" stroke-width="1.8" fill="none" marker-end="url(#s-azul)"/>
  <path d="M636 150 C 648 100, 666 100, 678 150" stroke="#ff9447" stroke-width="1.8" fill="none" marker-end="url(#s-laranja)"/>
  <text x="470" y="104" font-family="Cascadia Code, Consolas, monospace" font-size="12.5" fill="#56a8f5">floor: 2.0</text>
  <text x="596" y="82" font-family="Cascadia Code, Consolas, monospace" font-size="12.5" fill="#ff9447">ceil: 3.0, round: 3</text>

  <!-- -2.5 abaixo -->
  <circle cx="130" cy="160" r="6" fill="#f2c75c"/>
  <text x="130" y="140" font-family="Cascadia Code, Consolas, monospace" font-size="14" font-weight="700" fill="#f2c75c" text-anchor="middle">-2.5</text>
  <path d="M124 170 C 112 230, 94 230, 82 170" stroke="#56a8f5" stroke-width="1.8" fill="none" marker-end="url(#s-azul)"/>
  <path d="M136 170 C 148 230, 166 230, 178 170" stroke="#ff9447" stroke-width="1.8" fill="none" marker-end="url(#s-laranja)"/>
  <text x="40" y="250" font-family="Cascadia Code, Consolas, monospace" font-size="12.5" fill="#56a8f5">floor: -3.0</text>
  <text x="150" y="250" font-family="Cascadia Code, Consolas, monospace" font-size="12.5" fill="#ff9447">ceil: -2.0, round: -2</text>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13">
    <text x="30" y="36" fill="#56a8f5">floor: sempre para a esquerda</text>
    <text x="260" y="36" fill="#ff9447">ceil: sempre para a direita</text>
    <text x="470" y="36" fill="#bcbec4">round: para o mais perto; no meio, à direita</text>
  </g>
  <text x="30" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#8a8277">"À direita" é no sentido do +∞: para os negativos, isso é para perto do zero.</text>
</svg>
