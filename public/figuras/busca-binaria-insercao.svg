  <text x="320" y="167" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#bcbec4">meio 3: 25 &gt; 20, procura à esquerda</text>
  <rect x="42" y="192" width="48" height="38" rx="4" fill="#1b1916" stroke="#2b2824"/>
  <text x="66.0" y="217" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#5c564e" text-anchor="middle">3</text>
  <rect x="94" y="192" width="48" height="38" rx="4" fill="#1b1916" stroke="#2b2824"/>
  <text x="118.0" y="217" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#5c564e" text-anchor="middle">7</text>
  <rect x="146" y="192" width="48" height="38" rx="4" fill="#1b1916" stroke="#2b2824"/>
  <text x="170.0" y="217" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#5c564e" text-anchor="middle">19</text>
  <rect x="198" y="192" width="48" height="38" rx="4" fill="#1b1916" stroke="#2b2824"/>
  <text x="222.0" y="217" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#5c564e" text-anchor="middle">25</text>
  <rect x="250" y="192" width="48" height="38" rx="4" fill="#1b1916" stroke="#2b2824"/>
  <text x="274.0" y="217" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#5c564e" text-anchor="middle">42</text>
  <text x="320" y="208" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">passo 3</text>
  <text x="320" y="225" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#bcbec4">início 3 &gt; fim 2: não está no array</text>
  <path d="M196 184 L196 238" stroke="#56a8f5" stroke-width="2.4"/>
  <path d="M190 246 L196 236 L202 246 z" fill="#56a8f5"/>
  <text x="196" y="264" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#56a8f5" text-anchor="middle">o 20 entraria aqui: ponto de inserção 3</text>
  <text x="40" y="306" font-family="Cascadia Code, Consolas, monospace" font-size="15" fill="#56a8f5">resultado: -(3) - 1 = -4</text>
  <text x="330" y="306" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#8a8277">O - 1 separa "entraria na posição 0" de "achei na posição 0".</text>
</svg>
