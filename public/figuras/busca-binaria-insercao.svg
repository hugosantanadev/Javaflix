  <text x="170.0" y="159" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#5c564e" text-anchor="middle">19</text>
  <rect x="198" y="134" width="48" height="38" rx="4" fill="#3a1d07" stroke="#ff7a1a"/>
  <text x="222.0" y="159" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#ff9447" text-anchor="middle">25</text>
  <rect x="250" y="134" width="48" height="38" rx="4" fill="#13221a" stroke="#4fd68b"/>
