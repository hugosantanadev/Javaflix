<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t">
  <title id="t">A busca binária de 20 em [3, 7, 19, 25, 42]: o meio 2 vale 19, menor, e a busca vai para a direita; o meio 3 vale 25, maior, e a busca vai para a esquerda; o intervalo fica vazio com o ponto de inserção 3, e o resultado é −3 − 1 = −4</title>
  <rect width="760" height="330" fill="#13110f"/>
  <text x="40" y="34" font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#f3eee7">Arrays.binarySearch(new int[] {3, 7, 19, 25, 42}, 20)</text>
  <text x="66.0" y="66" font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#8a8277" text-anchor="middle">0</text>
  <text x="118.0" y="66" font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#8a8277" text-anchor="middle">1</text>
