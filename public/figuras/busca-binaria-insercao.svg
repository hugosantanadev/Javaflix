  <text x="222.0" y="66" font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#8a8277" text-anchor="middle">3</text>
  <text x="274.0" y="66" font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#8a8277" text-anchor="middle">4</text>
