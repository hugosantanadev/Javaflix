  <text x="118.0" y="101" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#4fd68b" text-anchor="middle">7</text>
  <rect x="146" y="76" width="48" height="38" rx="4" fill="#3a1d07" stroke="#ff7a1a"/>
  <text x="170.0" y="101" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#ff9447" text-anchor="middle">19</text>
  <rect x="198" y="76" width="48" height="38" rx="4" fill="#13221a" stroke="#4fd68b"/>
  <text x="222.0" y="101" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#4fd68b" text-anchor="middle">25</text>
  <rect x="250" y="76" width="48" height="38" rx="4" fill="#13221a" stroke="#4fd68b"/>
  <text x="274.0" y="101" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#4fd68b" text-anchor="middle">42</text>
  <text x="320" y="92" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">passo 1</text>
  <text x="320" y="109" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#bcbec4">meio 2: 19 &lt; 20, procura à direita</text>
  <rect x="42" y="134" width="48" height="38" rx="4" fill="#1b1916" stroke="#2b2824"/>
  <text x="66.0" y="159" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#5c564e" text-anchor="middle">3</text>
  <rect x="94" y="134" width="48" height="38" rx="4" fill="#1b1916" stroke="#2b2824"/>
  <text x="118.0" y="159" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#5c564e" text-anchor="middle">7</text>
