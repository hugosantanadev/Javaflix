<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="t">
  <title id="t">Como o caixa divide um saque de R$ 380 em notas: a divisão inteira pela nota maior diz quantas notas cabem e o resto passa para a nota seguinte</title>
  <rect width="760" height="320" fill="#13110f"/>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277" text-anchor="middle">
    <text x="105" y="44">valor</text>
    <text x="285" y="44">sobra</text>
    <text x="465" y="44">sobra</text>
    <text x="645" y="44">sobra</text>
  </g>

  <g fill="#1b1916" stroke="#312d28">
    <rect x="45" y="54" width="120" height="56" rx="6"/>
    <rect x="225" y="54" width="120" height="56" rx="6"/>
    <rect x="405" y="54" width="120" height="56" rx="6"/>
    <rect x="585" y="54" width="120" height="56" rx="6"/>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="28" font-weight="700" fill="#f3eee7" text-anchor="middle">
    <text x="105" y="92">380</text>
    <text x="285" y="92">80</text>
    <text x="465" y="92">30</text>
    <text x="645" y="92">10</text>
  </g>

  <g stroke="#8a8277" stroke-width="1.6" fill="none">
    <path d="M171 82 h46 m-7 -5 l7 5 l-7 5"/>
    <path d="M351 82 h46 m-7 -5 l7 5 l-7 5"/>
    <path d="M531 82 h46 m-7 -5 l7 5 l-7 5"/>
  </g>

  <g font-family="Cascadia Code, Consolas, monospace" font-size="14" text-anchor="middle">
    <text x="105" y="140" fill="#f2c75c">380 / 100 = 3</text>
    <text x="105" y="162" fill="#bdb5aa">380 % 100 = 80</text>
    <text x="285" y="140" fill="#f2c75c">80 / 50 = 1</text>
    <text x="285" y="162" fill="#bdb5aa">80 % 50 = 30</text>
    <text x="465" y="140" fill="#f2c75c">30 / 20 = 1</text>
    <text x="465" y="162" fill="#bdb5aa">30 % 20 = 10</text>
    <text x="645" y="140" fill="#f2c75c">10 / 10 = 1</text>
    <text x="645" y="162" fill="#bdb5aa">10 % 10 = 0</text>
  </g>

  <!-- notas: a de 100 aparece três vezes, empilhada -->
  <g fill="#1b1916" stroke="#4fd68b" stroke-width="1.4">
    <rect x="61" y="186" width="100" height="50" rx="5" opacity="0.45"/>
    <rect x="55" y="192" width="100" height="50" rx="5" opacity="0.7"/>
    <rect x="49" y="198" width="100" height="50" rx="5"/>
    <rect x="235" y="198" width="100" height="50" rx="5"/>
    <rect x="415" y="198" width="100" height="50" rx="5"/>
    <rect x="595" y="198" width="100" height="50" rx="5"/>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="20" font-weight="700" fill="#f3eee7" text-anchor="middle">
    <text x="99" y="230">R$ 100</text>
    <text x="285" y="230">R$ 50</text>
    <text x="465" y="230">R$ 20</text>
    <text x="645" y="230">R$ 10</text>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#4fd68b" text-anchor="middle">
    <text x="105" y="272">3 notas</text>
    <text x="285" y="272">1 nota</text>
    <text x="465" y="272">1 nota</text>
    <text x="645" y="272">1 nota</text>
  </g>

  <text x="380" y="304" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#bdb5aa" text-anchor="middle">A divisão inteira diz quantas notas cabem; o resto passa para a nota seguinte.</text>
</svg>
