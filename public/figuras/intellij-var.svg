<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t">
  <title id="t">Editor do IntelliJ com o cursor sobre um var, o menu do Alt+Enter com a opção Replace 'var' with explicit type e, ao lado, a prévia do código com String no lugar do var</title>
  <rect width="760" height="300" fill="#13110f"/>
  <rect x="16" y="14" width="728" height="272" rx="10" fill="#1e1f22" stroke="#43454a"/>
  <rect x="16" y="14" width="728" height="30" rx="10" fill="#2b2d30"/>
  <rect x="16" y="34" width="728" height="10" fill="#2b2d30"/>
  <rect x="24" y="18" width="124" height="24" rx="4" fill="#1e1f22"/>
  <circle cx="38" cy="30" r="5" fill="#3574f0"/>
  <text x="50" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#dfe1e5">Inferencia.java</text>

  <rect x="62" y="108" width="682" height="20" fill="#26282e"/>

  <g font-family="Cascadia Code, Consolas, monospace" font-size="13">
    <g fill="#6f737a" text-anchor="end">
      <text x="56" y="74">1</text><text x="56" y="98">2</text><text x="56" y="122">3</text><text x="56" y="146">4</text>
      <text x="56" y="170">5</text><text x="56" y="194">6</text><text x="56" y="218">7</text>
    </g>
    <text x="80" y="74"><tspan fill="#cf8e6d">public class</tspan><tspan fill="#bcbec4"> Inferencia {</tspan></text>
    <text x="111" y="98"><tspan fill="#cf8e6d">public static void</tspan><tspan fill="#56a8f5"> main</tspan><tspan fill="#bcbec4">(String[] args) {</tspan></text>
    <text x="142" y="122" fill="#cf8e6d" textLength="23" lengthAdjust="spacingAndGlyphs">var</text>
    <text x="173" y="122"><tspan fill="#bcbec4">nome = </tspan><tspan fill="#6aab73">"Ana"</tspan><tspan fill="#bcbec4">;</tspan></text>
    <text x="142" y="146"><tspan fill="#cf8e6d">var</tspan><tspan fill="#bcbec4"> idade = </tspan><tspan fill="#2aacb8">30</tspan><tspan fill="#bcbec4">;</tspan></text>
    <text x="142" y="170"><tspan fill="#bcbec4">System.</tspan><tspan fill="#c77dbb" font-style="italic">out</tspan><tspan fill="#bcbec4">.println(nome + idade);</tspan></text>
    <text x="111" y="194" fill="#bcbec4">}</text>
    <text x="80" y="218" fill="#bcbec4">}</text>
  </g>
  <line x1="153" y1="109" x2="153" y2="127" stroke="#dfe1e5" stroke-width="1.5"/>
  <circle cx="73" cy="116" r="5" fill="#e8b440"/><rect x="70" y="122" width="6" height="3" rx="1" fill="#e8b440"/>

  <!-- menu do Alt + Enter -->
  <rect x="142" y="134" width="252" height="58" rx="6" fill="#2b2d30" stroke="#43454a"/>
  <rect x="146" y="138" width="244" height="24" rx="4" fill="#2e436e"/>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#dfe1e5">
    <text x="156" y="155">Replace 'var' with explicit type</text>
    <text x="156" y="180" fill="#bcbec4">Adjust code style settings</text>
  </g>

  <!-- prévia -->
  <rect x="408" y="134" width="320" height="58" rx="6" fill="#1e1f22" stroke="#43454a"/>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="12.5">
    <text x="420" y="156" fill="#6f737a" text-decoration="line-through"><tspan fill="#cf8e6d">var</tspan> nome = "Ana";</text>
    <text x="420" y="180"><tspan fill="#bcbec4">String nome = </tspan><tspan fill="#6aab73">"Ana"</tspan><tspan fill="#bcbec4">;</tspan></text>
  </g>
  <rect x="408" y="166" width="4" height="20" fill="#5fb865"/>
  <rect x="408" y="142" width="4" height="20" fill="#db5c5c"/>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1a0b01">
    <circle cx="294" cy="118" r="11" fill="#ff7a1a"/><text x="294" y="122">1</text>
    <circle cx="380" cy="150" r="11" fill="#ff7a1a"/><text x="380" y="154">2</text>
    <circle cx="716" cy="134" r="11" fill="#ff7a1a"/><text x="716" y="138">3</text>
  </g>
  <text x="80" y="254" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#bcbec4">Alt + Enter sobre o <tspan font-family="Cascadia Code, Consolas, monospace">var</tspan> escreve o tipo que o compilador inferiu.</text>
  <text x="80" y="274" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#6f737a">Sobre um tipo escrito, a mesma tecla faz o caminho inverso.</text>
</svg>
