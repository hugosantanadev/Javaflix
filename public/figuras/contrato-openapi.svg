<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t">
  <title id="t">Um contrato OpenAPI no centro e cinco usos ao redor: a documentação interativa do Swagger UI, os clientes gerados para o aplicativo e outros serviços, o esqueleto do servidor, os testes de contrato e a validação das requisições num gateway</title>
  <rect width="760" height="300" fill="#13110f"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/></marker>
  </defs>
  <rect x="290" y="110" width="180" height="70" rx="8" fill="#26170c" stroke="#ff7a1a"/>
  <text x="380" y="140" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700" fill="#ff7a1a" text-anchor="middle">openapi.yaml</text>
  <text x="380" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#bdb5aa" text-anchor="middle">rotas, esquemas, respostas</text>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12" text-anchor="middle">
    <rect x="30" y="30" width="190" height="48" rx="8" fill="#1b1916" stroke="#8a8277"/>
    <text x="125" y="52" font-weight="700" fill="#f3eee7">Swagger UI</text>
    <text x="125" y="68" fill="#8a8277">documentação que testa</text>
    <rect x="540" y="30" width="190" height="48" rx="8" fill="#1b1916" stroke="#8a8277"/>
    <text x="635" y="52" font-weight="700" fill="#f3eee7">Clientes gerados</text>
    <text x="635" y="68" fill="#8a8277">aplicativo e outros serviços</text>
    <rect x="30" y="212" width="190" height="48" rx="8" fill="#1b1916" stroke="#8a8277"/>
    <text x="125" y="234" font-weight="700" fill="#f3eee7">Esqueleto do servidor</text>
    <text x="125" y="250" fill="#8a8277">interfaces dos controllers</text>
    <rect x="540" y="212" width="190" height="48" rx="8" fill="#1b1916" stroke="#8a8277"/>
    <text x="635" y="234" font-weight="700" fill="#f3eee7">Testes de contrato</text>
    <text x="635" y="250" fill="#8a8277">a API cumpre o documento?</text>
    <rect x="285" y="236" width="190" height="48" rx="8" fill="#1b1916" stroke="#8a8277"/>
    <text x="380" y="258" font-weight="700" fill="#f3eee7">Gateway</text>
    <text x="380" y="274" fill="#8a8277">recusa o que foge do esquema</text>
  </g>
  <g stroke="#8a8277" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M300 112 L215 78"/>
    <path d="M460 112 L545 78"/>
    <path d="M300 178 L215 214"/>
    <path d="M460 178 L545 214"/>
    <path d="M380 180 L380 233"/>
