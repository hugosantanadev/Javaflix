  <text x="380" y="38" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#bdb5aa" text-anchor="middle">um documento, escrito uma vez,</text>
  <text x="380" y="56" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#bdb5aa" text-anchor="middle">lido por pessoas e por programas</text>
