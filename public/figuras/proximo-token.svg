<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="t">
  <title id="t">Geração de texto token a token: o contexto "public static void" entra no modelo, que devolve uma probabilidade para cada próximo token possível: main 72 por cento, run 9, print 6, init 4 e o resto 9; o token escolhido é acrescentado ao contexto e o ciclo se repete</title>
  <rect width="760" height="320" fill="#13110f"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/></marker>
  </defs>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">
    <rect x="20" y="70" width="70" height="30" rx="4" fill="#1b1916" stroke="#8a8277"/>
    <text x="55" y="90" fill="#f3eee7">public</text>
    <rect x="96" y="70" width="70" height="30" rx="4" fill="#1b1916" stroke="#8a8277"/>
    <text x="131" y="90" fill="#f3eee7">␣static</text>
    <rect x="172" y="70" width="62" height="30" rx="4" fill="#1b1916" stroke="#8a8277"/>
    <text x="203" y="90" fill="#f3eee7">␣void</text>
  </g>
  <text x="20" y="56" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">contexto (3 tokens)</text>
  <rect x="270" y="55" width="120" height="60" rx="8" fill="#26170c" stroke="#ff7a1a"/>
  <text x="330" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#ff7a1a" text-anchor="middle">modelo</text>
  <path d="M234 85 L267 85" stroke="#8a8277" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M390 85 L423 85" stroke="#8a8277" stroke-width="1.6" marker-end="url(#a)"/>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="12">
    <text x="430" y="50" fill="#4fd68b" font-weight="700">␣main</text>
    <rect x="490" y="40" width="216" height="14" rx="2" fill="#4fd68b"/>
    <text x="712" y="52" fill="#4fd68b">72%</text>
    <text x="430" y="74" fill="#bdb5aa">␣run</text>
    <rect x="490" y="64" width="27" height="14" rx="2" fill="#8a8277"/>
    <text x="523" y="76" fill="#bdb5aa">9%</text>
    <text x="430" y="98" fill="#bdb5aa">␣print</text>
    <rect x="490" y="88" width="18" height="14" rx="2" fill="#8a8277"/>
    <text x="514" y="100" fill="#bdb5aa">6%</text>
    <text x="430" y="122" fill="#bdb5aa">␣init</text>
    <rect x="490" y="112" width="12" height="14" rx="2" fill="#8a8277"/>
    <text x="508" y="124" fill="#bdb5aa">4%</text>
    <text x="430" y="146" fill="#8a8277">outros</text>
    <rect x="490" y="136" width="27" height="14" rx="2" fill="#43403a"/>
    <text x="523" y="148" fill="#8a8277">9%</text>
  </g>
  <path d="M560 160 C 560 230, 140 230, 140 108" stroke="#4fd68b" stroke-width="1.6" stroke-dasharray="5 3" fill="none" marker-end="url(#a)"/>
  <text x="300" y="222" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#4fd68b">o token sorteado entra no contexto, e o ciclo recomeça</text>
  <text x="20" y="272" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#bdb5aa">O modelo não consulta nada: só calcula qual pedaço de texto costuma vir depois deste contexto.</text>
  <text x="20" y="296" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#8a8277">"Provável" não é "verdadeiro": é daí que vêm as alucinações.</text>
</svg>
