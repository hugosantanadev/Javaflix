<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t">
  <title id="t">Com s valendo null, a expressão s != null &amp;&amp; s.length() &gt; 3 para no lado esquerdo e dá false sem executar o direito; com &amp;, o lado direito roda e lança NullPointerException</title>
  <rect width="760" height="300" fill="#13110f"/>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/>
    </marker>
  </defs>
  <text x="30" y="34" font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#bdb5aa">String s = null;</text>

  <!-- && -->
  <text x="30" y="96" font-family="Cascadia Code, Consolas, monospace" font-size="22" font-weight="700" fill="#ff9447">&amp;&amp;</text>
  <rect x="80" y="70" width="170" height="40" rx="6" fill="#1b1916" stroke="#43403a"/>
  <text x="165" y="96" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace" font-size="15" fill="#f3eee7">s != null</text>
  <text x="165" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#ff9447">false</text>
  <rect x="300" y="70" width="190" height="40" rx="6" fill="none" stroke="#43403a" stroke-dasharray="5 4"/>
  <text x="395" y="96" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace" font-size="15" fill="#5c5750">s.length() &gt; 3</text>
  <text x="395" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#8a8277">nem é executado</text>
  <path d="M252 90 C 300 30, 520 30, 556 80" fill="none" stroke="#4fd68b" stroke-width="1.8" marker-end="url(#seta)"/>
  <rect x="560" y="70" width="170" height="40" rx="6" fill="#13221a" stroke="#4fd68b"/>
  <text x="645" y="96" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace" font-size="15" font-weight="700" fill="#4fd68b">false</text>
  <text x="645" y="130" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#4fd68b">o resultado já estava decidido</text>

  <line x1="30" y1="160" x2="730" y2="160" stroke="#2b2824"/>

  <!-- & -->
  <text x="38" y="216" font-family="Cascadia Code, Consolas, monospace" font-size="22" font-weight="700" fill="#ff9447">&amp;</text>
  <rect x="80" y="190" width="170" height="40" rx="6" fill="#1b1916" stroke="#43403a"/>
  <text x="165" y="216" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace" font-size="15" fill="#f3eee7">s != null</text>
  <text x="165" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#ff9447">false</text>
  <line x1="252" y1="210" x2="296" y2="210" stroke="#8a8277" stroke-width="1.8" marker-end="url(#seta)"/>
  <rect x="300" y="190" width="190" height="40" rx="6" fill="#2a1414" stroke="#db5c5c"/>
  <text x="395" y="216" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace" font-size="15" fill="#ff8a80">s.length() &gt; 3</text>
  <text x="395" y="250" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#db5c5c">roda mesmo assim</text>
  <line x1="492" y1="210" x2="556" y2="210" stroke="#db5c5c" stroke-width="1.8" marker-end="url(#seta)"/>
  <rect x="560" y="190" width="170" height="40" rx="6" fill="#2a1414" stroke="#db5c5c"/>
  <text x="645" y="215" text-anchor="middle" font-family="Cascadia Code, Consolas, monospace" font-size="12" font-weight="700" fill="#ff8a80">NullPointerException</text>
  <text x="30" y="286" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#bdb5aa">&amp;&amp; e || param assim que o resultado está decidido; &amp; e | sempre calculam os dois lados.</text>
</svg>
