<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="t">
  <title id="t">Um índice em árvore B: a página raiz tem as chaves 300 e 600 e aponta para três páginas internas; cada página interna aponta para páginas folha, que guardam as chaves em ordem e a localização da linha na tabela; a busca pelo cliente 418 lê a raiz, uma página interna e uma folha, três leituras</title>
  <rect width="760" height="310" fill="#13110f"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/></marker>
    <marker id="l" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a1a"/></marker>
  </defs>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">
    <rect x="300" y="24" width="160" height="34" rx="4" fill="#26170c" stroke="#ff7a1a"/>
    <text x="350" y="46" fill="#ff7a1a">300</text><text x="410" y="46" fill="#ff7a1a">600</text>

    <rect x="60" y="104" width="160" height="34" rx="4" fill="#1b1916" stroke="#8a8277"/>
    <text x="110" y="126" fill="#bdb5aa">100</text><text x="170" y="126" fill="#bdb5aa">200</text>
    <rect x="300" y="104" width="160" height="34" rx="4" fill="#26170c" stroke="#ff7a1a"/>
    <text x="350" y="126" fill="#ff7a1a">400</text><text x="410" y="126" fill="#ff7a1a">500</text>
    <rect x="540" y="104" width="160" height="34" rx="4" fill="#1b1916" stroke="#8a8277"/>
    <text x="590" y="126" fill="#bdb5aa">700</text><text x="650" y="126" fill="#bdb5aa">800</text>

    <rect x="200" y="188" width="110" height="52" rx="4" fill="#1b1916" stroke="#8a8277"/>
    <text x="255" y="208" fill="#bdb5aa">301 ... 399</text><text x="255" y="228" fill="#6b645b">linhas</text>
    <rect x="325" y="188" width="110" height="52" rx="4" fill="#13221a" stroke="#4fd68b"/>
    <text x="380" y="208" fill="#4fd68b">400 ... 499</text><text x="380" y="228" fill="#4fd68b">418 → linha</text>
    <rect x="450" y="188" width="110" height="52" rx="4" fill="#1b1916" stroke="#8a8277"/>
    <text x="505" y="208" fill="#bdb5aa">500 ... 599</text><text x="505" y="228" fill="#6b645b">linhas</text>
  </g>
  <g stroke="#8a8277" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M320 58 L160 101"/>
    <path d="M440 58 L620 101"/>
    <path d="M320 138 L265 185"/>
    <path d="M440 138 L495 185"/>
  </g>
  <g stroke="#ff7a1a" stroke-width="1.8" fill="none" marker-end="url(#l)">
    <path d="M380 58 L380 101"/>
    <path d="M380 138 L380 185"/>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">
    <text x="480" y="44">raiz: sempre na memória</text>
    <text x="20" y="282" fill="#bdb5aa">Busca do cliente 418: raiz, uma página interna e uma folha. Três leituras, em vez de varrer a tabela.</text>
    <text x="20" y="302">Com centenas de chaves por página, 3 ou 4 níveis bastam para centenas de milhões de linhas.</text>
  </g>
</svg>
