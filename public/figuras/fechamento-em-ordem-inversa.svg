<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t">
  <title id="t">A linha do tempo de um try-with-resources com dois recursos, A e B, um catch e um finally: abre A, abre B, o corpo roda e lança uma exceção, fecha B, fecha A, só então roda o catch e depois o finally; embaixo, se o close de B também lança, essa exceção é anexada à do corpo como suprimida, e o catch recebe a do corpo, com getSuppressed devolvendo a do fechamento</title>
  <rect width="760" height="330" fill="#13110f"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/></marker>
  </defs>
  <text x="20" y="30" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#bdb5aa">try (Recurso a = ...; Recurso b = ...) { corpo } catch (...) { } finally { }</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="11">
    <rect x="20" y="52" width="88" height="44" rx="6" fill="#13221a" stroke="#4fd68b"/>
    <text x="32" y="78" fill="#4fd68b">abre A</text>
    <rect x="122" y="52" width="88" height="44" rx="6" fill="#13221a" stroke="#4fd68b"/>
    <text x="134" y="78" fill="#4fd68b">abre B</text>
    <rect x="224" y="52" width="88" height="44" rx="6" fill="#26170c" stroke="#ff7a1a"/>
    <text x="236" y="78" fill="#ff7a1a">corpo</text>
    <rect x="326" y="52" width="88" height="44" rx="6" fill="#1b1916" stroke="#f2c75c"/>
    <text x="338" y="78" fill="#f2c75c">fecha B</text>
    <rect x="428" y="52" width="88" height="44" rx="6" fill="#1b1916" stroke="#f2c75c"/>
    <text x="440" y="78" fill="#f2c75c">fecha A</text>
    <rect x="530" y="52" width="88" height="44" rx="6" fill="#1b1916" stroke="#8a8277"/>
    <text x="542" y="78" fill="#f3eee7">catch</text>
    <rect x="632" y="52" width="108" height="44" rx="6" fill="#1b1916" stroke="#8a8277"/>
    <text x="644" y="78" fill="#f3eee7">finally</text>
  </g>
  <g stroke="#8a8277" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M108 74 L119 74"/>
    <path d="M210 74 L221 74"/>
    <path d="M312 74 L323 74"/>
    <path d="M414 74 L425 74"/>
    <path d="M516 74 L527 74"/>
    <path d="M618 74 L629 74"/>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="11" fill="#8a8277">
    <text x="20" y="118">na ordem da declaração</text>
    <text x="224" y="118">lança X</text>
    <text x="326" y="118">na ordem inversa, antes do catch</text>
    <text x="530" y="118">recursos já fechados</text>
  </g>
  <text x="20" y="160" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#bdb5aa">E se o close() de B também lançar?</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="11">
    <rect x="20" y="174" width="220" height="64" rx="6" fill="#26170c" stroke="#ff7a1a"/>
    <text x="32" y="198" fill="#ff7a1a" font-weight="700">X, do corpo</text>
    <text x="32" y="222" fill="#bdb5aa">continua a principal</text>
    <rect x="300" y="174" width="220" height="64" rx="6" fill="#1b1916" stroke="#f2c75c" stroke-dasharray="4 3"/>
    <text x="312" y="198" fill="#f2c75c" font-weight="700">Y, do close()</text>
    <text x="312" y="222" fill="#bdb5aa">X.addSuppressed(Y)</text>
    <rect x="580" y="174" width="160" height="64" rx="6" fill="#1b1916" stroke="#8a8277"/>
    <text x="592" y="198" fill="#f3eee7" font-weight="700">catch recebe X</text>
    <text x="592" y="222" fill="#bdb5aa">getSuppressed(): [Y]</text>
  </g>
  <g stroke="#8a8277" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M300 206 L243 206"/>
    <path d="M240 254 C 400 280, 560 280, 640 241"/>
  </g>
  <text x="20" y="306" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">Com finally, Y substituiria X. Aqui nada se perde: Y viaja anexada a X.</text>
</svg>
