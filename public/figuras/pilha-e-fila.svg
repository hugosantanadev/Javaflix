<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-labelledby="t">
  <title id="t">Os números 1, 2 e 3 entram, nessa ordem, numa pilha e numa fila. Na pilha, tudo entra e sai pelo topo, e o primeiro a sair é o 3, o último que entrou. Na fila, entra-se pelo fim e sai-se pelo começo, e o primeiro a sair é o 1</title>
  <rect width="760" height="290" fill="#13110f"/>
  <defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff7a1a"/></marker>
  <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4fd68b"/></marker></defs>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700">
    <text x="60" y="34" fill="#f3eee7">Pilha (LIFO)</text><text x="400" y="34" fill="#f3eee7">Fila (FIFO)</text>
  </g>
  <path d="M90 70 L90 230 L190 230 L190 70" fill="none" stroke="#43403a" stroke-width="2"/>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="16" text-anchor="middle">
    <rect x="96" y="184" width="88" height="40" fill="#1b1916" stroke="#bdb5aa"/><text x="140" y="210" fill="#f3eee7">1</text>
    <rect x="96" y="140" width="88" height="40" fill="#1b1916" stroke="#bdb5aa"/><text x="140" y="166" fill="#f3eee7">2</text>
    <rect x="96" y="96" width="88" height="40" fill="#1b1916" stroke="#4fd68b"/><text x="140" y="122" fill="#4fd68b">3</text>
  </g>
  <path d="M220 80 L220 50" stroke="#ff7a1a" stroke-width="1.6" marker-end="url(#s)"/><text x="230" y="70" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#ff7a1a">push</text>
  <path d="M260 50 L260 80" stroke="#4fd68b" stroke-width="1.6" marker-end="url(#v)"/><text x="270" y="70" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#4fd68b">pop → 3</text>
  <path d="M420 150 L700 150" stroke="#43403a" stroke-width="2"/><path d="M420 196 L700 196" stroke="#43403a" stroke-width="2"/>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="16" text-anchor="middle">
    <rect x="440" y="153" width="70" height="40" fill="#1b1916" stroke="#4fd68b"/><text x="475" y="179" fill="#4fd68b">1</text>
    <rect x="520" y="153" width="70" height="40" fill="#1b1916" stroke="#bdb5aa"/><text x="555" y="179" fill="#f3eee7">2</text>
    <rect x="600" y="153" width="70" height="40" fill="#1b1916" stroke="#bdb5aa"/><text x="635" y="179" fill="#f3eee7">3</text>
  </g>
  <path d="M750 173 L708 173" stroke="#ff7a1a" stroke-width="1.6" marker-end="url(#s)"/><text x="690" y="135" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#ff7a1a">offer</text>
  <path d="M436 173 L394 173" stroke="#4fd68b" stroke-width="1.6" marker-end="url(#v)"/><text x="380" y="135" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#4fd68b">poll → 1</text>
  <text x="40" y="276" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#bdb5aa">Mesma entrada, 1, 2, 3: a pilha devolve primeiro o último; a fila, o primeiro.</text>
</svg>
