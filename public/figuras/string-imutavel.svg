<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t">
  <title id="t">Reatribuir uma String não altera o objeto: antes, a e b apontam para "café"; depois de a = a + " com leite", a aponta para um objeto novo e b continua apontando para "café", que não mudou</title>
  <rect width="760" height="300" fill="#13110f"/>
  <defs>
    <marker id="s-verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4fd68b"/></marker>
    <marker id="s-laranja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff9447"/></marker>
  </defs>
  <line x1="380" y1="20" x2="380" y2="270" stroke="#2b2824"/>

  <!-- antes -->
  <text x="30" y="36" font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#f3eee7">String b = a;</text>
  <text x="30" y="58" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">antes: duas setas, um objeto</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="16" font-weight="700">
    <rect x="30" y="90" width="50" height="40" rx="4" fill="#1b1916" stroke="#43403a"/><text x="55" y="116" fill="#f3eee7" text-anchor="middle">a</text>
    <rect x="30" y="170" width="50" height="40" rx="4" fill="#1b1916" stroke="#43403a"/><text x="55" y="196" fill="#f3eee7" text-anchor="middle">b</text>
    <rect x="200" y="125" width="120" height="50" rx="6" fill="#13221a" stroke="#4fd68b"/><text x="260" y="156" fill="#4fd68b" text-anchor="middle">"café"</text>
  </g>
  <g stroke="#4fd68b" stroke-width="1.8" fill="none" marker-end="url(#s-verde)">
    <path d="M82 110 C 140 110, 150 140, 196 144"/>
    <path d="M82 190 C 140 190, 150 160, 196 156"/>
  </g>

  <!-- depois -->
  <text x="400" y="36" font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#f3eee7">a = a + " com leite";</text>
  <text x="400" y="58" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">depois: a seta de a muda de alvo</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="16" font-weight="700">
    <rect x="400" y="90" width="50" height="40" rx="4" fill="#1b1916" stroke="#43403a"/><text x="425" y="116" fill="#f3eee7" text-anchor="middle">a</text>
    <rect x="400" y="170" width="50" height="40" rx="4" fill="#1b1916" stroke="#43403a"/><text x="425" y="196" fill="#f3eee7" text-anchor="middle">b</text>
    <rect x="540" y="86" width="190" height="48" rx="6" fill="#3a1d07" stroke="#ff7a1a"/><text x="635" y="116" fill="#ff9447" text-anchor="middle">"café com leite"</text>
    <rect x="570" y="166" width="120" height="48" rx="6" fill="#13221a" stroke="#4fd68b"/><text x="630" y="196" fill="#4fd68b" text-anchor="middle">"café"</text>
  </g>
  <path d="M452 110 L 536 110" stroke="#ff9447" stroke-width="1.8" fill="none" marker-end="url(#s-laranja)"/>
  <path d="M452 190 L 566 190" stroke="#4fd68b" stroke-width="1.8" fill="none" marker-end="url(#s-verde)"/>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12">
    <text x="540" y="152" fill="#ff9447">objeto novo</text>
    <text x="570" y="232" fill="#8a8277">o mesmo objeto, intacto</text>
  </g>

  <text x="30" y="288" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#bcbec4">Nenhum objeto String muda. O que muda é para onde a variável aponta.</text>
</svg>
