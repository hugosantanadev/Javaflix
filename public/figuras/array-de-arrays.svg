<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="t">
  <title id="t">Um array de arrays: new int[3][] cria só o array externo, com as três linhas null; em notas, o array externo guarda três referências para linhas separadas, de tamanhos 2, 1 e 3</title>
  <rect width="760" height="320" fill="#13110f"/>
  <defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4fd68b"/></marker></defs>
  <line x1="230" y1="20" x2="230" y2="270" stroke="#2b2824"/>
  <text x="30" y="40" font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#f3eee7">new int[3][]</text>
  <text x="62" y="107" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#bcbec4" text-anchor="end">[0]</text>
  <rect x="70" y="80" width="70" height="44" fill="#1b1916" stroke="#43403a"/>
  <text x="105" y="107" font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#8a8277" text-anchor="middle">null</text>
  <text x="62" y="163" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#bcbec4" text-anchor="end">[1]</text>
  <rect x="70" y="136" width="70" height="44" fill="#1b1916" stroke="#43403a"/>
  <text x="105" y="163" font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#8a8277" text-anchor="middle">null</text>
  <text x="62" y="219" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#bcbec4" text-anchor="end">[2]</text>
  <rect x="70" y="192" width="70" height="44" fill="#1b1916" stroke="#43403a"/>
  <text x="105" y="219" font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#8a8277" text-anchor="middle">null</text>
  <text x="30" y="264" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">as linhas ainda não existem</text>
  <text x="260" y="40" font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#f3eee7">int[][] notas = {{7, 8}, {5}, {9, 10, 6}};</text>
  <text x="292" y="107" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#bcbec4" text-anchor="end">[0]</text>
  <rect x="300" y="80" width="70" height="44" fill="#1b1916" stroke="#43403a"/>
  <circle cx="335" cy="102" r="4" fill="#4fd68b"/>
  <path d="M339 102 C 390 102, 410 86, 456 86" stroke="#4fd68b" stroke-width="1.6" fill="none" marker-end="url(#s)"/>
  <rect x="460" y="64" width="56" height="44" rx="2" fill="#13221a" stroke="#4fd68b"/>
  <text x="488" y="92" font-family="Cascadia Code, Consolas, monospace" font-size="16" font-weight="700" fill="#4fd68b" text-anchor="middle">7</text>
  <rect x="516" y="64" width="56" height="44" rx="2" fill="#13221a" stroke="#4fd68b"/>
  <text x="544" y="92" font-family="Cascadia Code, Consolas, monospace" font-size="16" font-weight="700" fill="#4fd68b" text-anchor="middle">8</text>
  <text x="584" y="91" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#bcbec4">notas[0].length = 2</text>
  <text x="292" y="163" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#bcbec4" text-anchor="end">[1]</text>
  <rect x="300" y="136" width="70" height="44" fill="#1b1916" stroke="#43403a"/>
  <circle cx="335" cy="158" r="4" fill="#4fd68b"/>
  <path d="M339 158 C 390 158, 470 158, 516 158" stroke="#4fd68b" stroke-width="1.6" fill="none" marker-end="url(#s)"/>
  <rect x="520" y="136" width="56" height="44" rx="2" fill="#13221a" stroke="#4fd68b"/>
  <text x="548" y="164" font-family="Cascadia Code, Consolas, monospace" font-size="16" font-weight="700" fill="#4fd68b" text-anchor="middle">5</text>
  <text x="588" y="163" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#bcbec4">notas[1].length = 1</text>
  <text x="292" y="219" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#bcbec4" text-anchor="end">[2]</text>
  <rect x="300" y="192" width="70" height="44" fill="#1b1916" stroke="#43403a"/>
  <circle cx="335" cy="214" r="4" fill="#4fd68b"/>
  <path d="M339 214 C 390 214, 370 230, 416 230" stroke="#4fd68b" stroke-width="1.6" fill="none" marker-end="url(#s)"/>
  <rect x="420" y="208" width="56" height="44" rx="2" fill="#13221a" stroke="#4fd68b"/>
  <text x="448" y="236" font-family="Cascadia Code, Consolas, monospace" font-size="16" font-weight="700" fill="#4fd68b" text-anchor="middle">9</text>
  <rect x="476" y="208" width="56" height="44" rx="2" fill="#13221a" stroke="#4fd68b"/>
  <text x="504" y="236" font-family="Cascadia Code, Consolas, monospace" font-size="16" font-weight="700" fill="#4fd68b" text-anchor="middle">10</text>
  <rect x="532" y="208" width="56" height="44" rx="2" fill="#13221a" stroke="#4fd68b"/>
  <text x="560" y="236" font-family="Cascadia Code, Consolas, monospace" font-size="16" font-weight="700" fill="#4fd68b" text-anchor="middle">6</text>
  <text x="600" y="235" font-family="Cascadia Code, Consolas, monospace" font-size="12" fill="#bcbec4">notas[2].length = 3</text>
  <text x="30" y="300" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#bcbec4">4 objetos: o array externo, com 3 referências, e as 3 linhas, cada uma com seu tamanho.</text>
</svg>
