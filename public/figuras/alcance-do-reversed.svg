<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t">
  <title id="t">O alcance do reversed numa cadeia de comparadores: em comparing de idade, depois reversed, depois thenComparing de nome, o reversed inverte só a idade, e o desempate por nome continua crescente; em comparing de nome, thenComparing de idade e reversed no fim, ele inverte a cadeia inteira, nome e idade</title>
  <rect width="760" height="300" fill="#13110f"/>
  <text x="20" y="30" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" fill="#bdb5aa">reversed() inverte tudo o que está à esquerda dele</text>
  <rect x="20" y="52" width="720" height="104" rx="8" fill="#1b1916" stroke="#2b2824"/>
  <rect x="20" y="168" width="720" height="104" rx="8" fill="#1b1916" stroke="#2b2824"/>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="13">
    <text x="36" y="82"><tspan fill="#ff7a1a">comparing(Pessoa::idade).reversed()</tspan><tspan fill="#4fd68b">.thenComparing(Pessoa::nome)</tspan></text>
    <text x="36" y="198" fill="#ff7a1a">comparing(Pessoa::nome).thenComparing(Pessoa::idade).reversed()</text>
  </g>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12">
    <text x="36" y="108" fill="#ff7a1a">laranja, invertido: idade decrescente</text>
    <text x="36" y="126" fill="#4fd68b">verde, fora do alcance: desempate por nome crescente</text>
    <text x="36" y="224" fill="#ff7a1a">tudo laranja, invertido: nome e idade decrescentes</text>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#bdb5aa">
    <text x="36" y="146">Ana(30) Bia(30) Caio(25) Ana(20)</text>
    <text x="36" y="252">Caio(25) Bia(30) Ana(30) Ana(20)</text>
  </g>
  <text x="20" y="292" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">Para inverter só o desempate: thenComparing(Pessoa::idade, Comparator.reverseOrder()).</text>
</svg>
