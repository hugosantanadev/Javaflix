<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" role="img" aria-labelledby="t">
  <title id="t">O byte 1010 1111 com o peso de cada posição embaixo, de 128 a 1. Os bits ligados somam 128 mais 32 mais 8 mais 4 mais 2 mais 1, que dá 175. Os dois grupos de 4 bits viram os dígitos hexadecimais A e F, e 0xAF também vale 175</title>
  <rect width="760" height="290" fill="#13110f"/>
  <g font-family="Cascadia Code, Consolas, monospace" text-anchor="middle">
    <g font-size="22" font-weight="700">
      <rect x="60" y="40" width="70" height="60" fill="#1b1916" stroke="#ff7a1a"/><text x="95" y="80" fill="#ff7a1a">1</text>
      <rect x="130" y="40" width="70" height="60" fill="#1b1916" stroke="#43403a"/><text x="165" y="80" fill="#8a8277">0</text>
      <rect x="200" y="40" width="70" height="60" fill="#1b1916" stroke="#ff7a1a"/><text x="235" y="80" fill="#ff7a1a">1</text>
      <rect x="270" y="40" width="70" height="60" fill="#1b1916" stroke="#43403a"/><text x="305" y="80" fill="#8a8277">0</text>
      <rect x="380" y="40" width="70" height="60" fill="#1b1916" stroke="#ff7a1a"/><text x="415" y="80" fill="#ff7a1a">1</text>
      <rect x="450" y="40" width="70" height="60" fill="#1b1916" stroke="#ff7a1a"/><text x="485" y="80" fill="#ff7a1a">1</text>
      <rect x="520" y="40" width="70" height="60" fill="#1b1916" stroke="#ff7a1a"/><text x="555" y="80" fill="#ff7a1a">1</text>
      <rect x="590" y="40" width="70" height="60" fill="#1b1916" stroke="#ff7a1a"/><text x="625" y="80" fill="#ff7a1a">1</text>
    </g>
    <g font-size="13" fill="#f2c75c">
      <text x="95" y="124">128</text><text x="165" y="124">64</text><text x="235" y="124">32</text><text x="305" y="124">16</text>
      <text x="415" y="124">8</text><text x="485" y="124">4</text><text x="555" y="124">2</text><text x="625" y="124">1</text>
    </g>
    <g font-size="11" fill="#8a8277">
      <text x="95" y="30">2⁷</text><text x="165" y="30">2⁶</text><text x="235" y="30">2⁵</text><text x="305" y="30">2⁴</text>
      <text x="415" y="30">2³</text><text x="485" y="30">2²</text><text x="555" y="30">2¹</text><text x="625" y="30">2⁰</text>
    </g>
    <g font-size="30" font-weight="700" fill="#4fd68b"><text x="200" y="190">A</text><text x="520" y="190">F</text></g>
    <g font-size="12" fill="#8a8277"><text x="200" y="210">1010 = 10</text><text x="520" y="210">1111 = 15</text></g>
  </g>
  <g stroke="#4fd68b" stroke-width="1.5" fill="none"><path d="M64 140 L64 150 L336 150 L336 140"/><path d="M384 140 L384 150 L656 150 L656 140"/></g>
  <text x="380" y="252" font-family="Cascadia Code, Consolas, monospace" font-size="14" fill="#f3eee7" text-anchor="middle">128 + 32 + 8 + 4 + 2 + 1 = 175 = 0xAF = 10 × 16 + 15</text>
  <text x="380" y="278" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#bdb5aa" text-anchor="middle">Cada posição vale o dobro da vizinha da direita; cada grupo de 4 bits é um dígito hexadecimal.</text>
</svg>
