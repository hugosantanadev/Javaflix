<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t">
  <title id="t">Editor do IntelliJ com uma linha sublinhada em vermelho por faltar ponto e vírgula, a mensagem do erro numa caixa e a sugestão de Alt+Enter</title>
  <rect width="760" height="300" fill="#13110f"/>
  <rect x="16" y="14" width="728" height="272" rx="10" fill="#1e1f22" stroke="#43454a"/>
  <rect x="16" y="14" width="728" height="30" rx="10" fill="#2b2d30"/>
  <rect x="16" y="34" width="728" height="10" fill="#2b2d30"/>
  <rect x="24" y="18" width="104" height="24" rx="4" fill="#1e1f22"/>
  <circle cx="38" cy="30" r="5" fill="#3574f0"/>
  <text x="50" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#dfe1e5">Main.java</text>
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12">
    <circle cx="682" cy="30" r="6" fill="#db5c5c"/>
    <text x="694" y="34" fill="#dfe1e5">1</text>
  </g>

  <g font-family="Cascadia Code, Consolas, monospace" font-size="13">
    <g fill="#6f737a" text-anchor="end">
      <text x="56" y="74">1</text><text x="56" y="98">2</text><text x="56" y="122">3</text><text x="56" y="146">4</text><text x="56" y="170">5</text>
    </g>
    <text x="80" y="74"><tspan fill="#cf8e6d">public class</tspan><tspan fill="#bcbec4"> Main {</tspan></text>
    <text x="80" y="98"><tspan fill="#cf8e6d">    public static void</tspan><tspan fill="#56a8f5"> main</tspan><tspan fill="#bcbec4">(String[] args) {</tspan></text>
    <text x="80" y="122" textLength="300" lengthAdjust="spacingAndGlyphs"><tspan fill="#bcbec4">        System.</tspan><tspan fill="#c77dbb" font-style="italic">out</tspan><tspan fill="#bcbec4">.println(</tspan><tspan fill="#6aab73">"Olá, Javaflix!"</tspan><tspan fill="#bcbec4">)</tspan></text>
    <text x="80" y="146" fill="#bcbec4">    }</text>
    <text x="80" y="170" fill="#bcbec4">}</text>
  </g>
  <path d="M372 127 q2.5 -3 5 0 t5 0 t5 0 t5 0" fill="none" stroke="#db5c5c" stroke-width="1.6"/>
  <rect x="736" y="114" width="6" height="4" fill="#db5c5c"/>

  <rect x="292" y="138" width="248" height="44" rx="6" fill="#2b2d30" stroke="#43454a"/>
  <text x="306" y="157" font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#dfe1e5">';' expected</text>
  <text x="306" y="174" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#548af7">Insert ';'   Alt+Enter</text>

  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1a0b01">
    <circle cx="402" cy="114" r="11" fill="#ff7a1a"/><text x="402" y="118">1</text>
    <circle cx="558" cy="152" r="11" fill="#ff7a1a"/><text x="558" y="156">2</text>
    <circle cx="558" cy="178" r="11" fill="#ff7a1a"/><text x="558" y="182">3</text>
    <circle cx="710" cy="54" r="11" fill="#ff7a1a"/><text x="710" y="58">4</text>
  </g>

  <text x="80" y="236" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#bcbec4">O erro aparece enquanto você digita, antes de compilar.</text>
  <text x="80" y="258" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#6f737a">Mesma mensagem do javac: a IDE usa o compilador por baixo.</text>
</svg>
