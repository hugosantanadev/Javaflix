<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t">
  <title id="t">As fases da resolução de sobrecarga para um argumento int: com a versão long declarada, a fase 1 já acha m(long) e a busca para; sem ela, a fase 1 não acha nada, e na fase 2 vence m(Integer), mais específica que m(Object); a fase 3, dos varargs, nem chega a ser olhada</title>
  <rect width="760" height="330" fill="#13110f"/>
  <rect x="30" y="74" width="700" height="62" rx="6" fill="#1a1612" stroke="#2b2824"/>
  <text x="44" y="100" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f3eee7">fase 1</text>
  <text x="44" y="120" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">exato ou alargamento</text>
  <rect x="30" y="146" width="700" height="62" rx="6" fill="#1a1612" stroke="#2b2824"/>
  <text x="44" y="172" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f3eee7">fase 2</text>
  <text x="44" y="192" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">autoboxing</text>
  <rect x="30" y="218" width="700" height="62" rx="6" fill="#1a1612" stroke="#2b2824"/>
  <text x="44" y="244" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f3eee7">fase 3</text>
  <text x="44" y="264" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">varargs</text>
  <text x="200" y="40" font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#f3eee7">m(i), com m(long) declarado</text>
  <text x="480" y="40" font-family="Cascadia Code, Consolas, monospace" font-size="13" fill="#f3eee7">m(5), sem m(long)</text>
  <line x1="460" y1="56" x2="460" y2="300" stroke="#2b2824"/>
  <rect x="200" y="90" width="77" height="30" rx="4" fill="#3a1d07" stroke="#ff7a1a"/>
  <text x="210" y="110" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700" fill="#ff9447">m(long)</text>
  <text x="300" y="110" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#ff9447">achou: a busca para aqui</text>
  <rect x="200" y="162" width="102" height="30" rx="4" fill="none" stroke="#2b2824" stroke-dasharray="4 3"/>
  <text x="210" y="182" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700" fill="#5c564e">m(Integer)</text>
  <rect x="312.0" y="162" width="94" height="30" rx="4" fill="none" stroke="#2b2824" stroke-dasharray="4 3"/>
  <text x="322.0" y="182" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700" fill="#5c564e">m(Object)</text>
  <rect x="200" y="234" width="94" height="30" rx="4" fill="none" stroke="#2b2824" stroke-dasharray="4 3"/>
  <text x="210" y="254" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700" fill="#5c564e">m(int...)</text>
  <text x="480" y="110" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#8a8277">nenhuma candidata</text>
  <rect x="480" y="162" width="102" height="30" rx="4" fill="#3a1d07" stroke="#ff7a1a"/>
  <text x="490" y="182" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700" fill="#ff9447">m(Integer)</text>
  <rect x="592.0" y="162" width="94" height="30" rx="4" fill="#1b1916" stroke="#43403a"/>
  <text x="602.0" y="182" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700" fill="#bcbec4">m(Object)</text>
  <text x="480" y="210" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#ff9447">Integer é mais específico que Object</text>
  <rect x="480" y="234" width="94" height="30" rx="4" fill="none" stroke="#2b2824" stroke-dasharray="4 3"/>
  <text x="490" y="254" font-family="Cascadia Code, Consolas, monospace" font-size="13" font-weight="700" fill="#5c564e">m(int...)</text>
  <text x="30" y="318" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#8a8277">As fases são olhadas em ordem, e a primeira com alguma candidata decide. As de baixo nem contam.</text>
</svg>
