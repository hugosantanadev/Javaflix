    <circle cx="280" cy="110" r="24" fill="#1b1916" stroke="#ff7a1a"/><text x="280" y="114" fill="#ff7a1a">b7fae</text>

    <circle cx="440" cy="200" r="24" fill="#1b1916" stroke="#8a8277"/><text x="440" y="204" fill="#bdb5aa">28f1f</text>
    <circle cx="540" cy="200" r="24" fill="#13221a" stroke="#4fd68b"/><text x="540" y="204" fill="#4fd68b">3edf4</text>
    <circle cx="640" cy="200" r="24" fill="#26170c" stroke="#ff7a1a"/><text x="640" y="204" fill="#ff7a1a">c3218</text>
    <circle cx="720" cy="140" r="24" fill="#26170c" stroke="#ff7a1a"/><text x="720" y="144" fill="#ff7a1a">03b51</text>
    <circle cx="520" cy="100" r="22" fill="#13110f" stroke="#43403a" stroke-dasharray="3 3"/><text x="520" y="104" fill="#6b645b">23018</text>
    <circle cx="610" cy="80" r="22" fill="#13110f" stroke="#43403a" stroke-dasharray="3 3"/><text x="610" y="84" fill="#6b645b">b7fae</text>
  </g>
  <g stroke="#8a8277" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M156 200 L87 200"/>
    <path d="M140 124 L80 182"/>
    <path d="M256 110 L187 110"/>
    <path d="M516 200 L467 200"/>
    <path d="M616 200 L567 200"/>
