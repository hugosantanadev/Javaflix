  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12">
    <text x="60" y="250" fill="#bdb5aa" text-anchor="middle">base antiga</text>
    <text x="180" y="250" fill="#4fd68b" text-anchor="middle">main</text>
    <text x="220" y="72" fill="#ff7a1a" text-anchor="middle">feature/cupom</text>
