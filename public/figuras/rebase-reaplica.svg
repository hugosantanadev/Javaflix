  <text x="20" y="286" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#8a8277">O conteúdo é o mesmo, mas o pai mudou: por isso os hashes mudam, e quem tinha os originais fica com outro histórico.</text>
