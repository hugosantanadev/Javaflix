<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="t">
  <title id="t">Rebase: antes, a branch feature/cupom tem os commits 2301874 e b7faed6 saindo de 28f1fa9, e a main ganhou 3edf437; depois do rebase, os commits viram cópias novas, c321861 e 03b5130, em cima de 3edf437, e os originais ficam sem branch, só no reflog</title>
  <rect width="760" height="300" fill="#13110f"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8277"/></marker>
  </defs>
  <text x="20" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f3eee7">Antes</text>
  <text x="400" y="34" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f3eee7">Depois de git rebase main</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="60" cy="200" r="24" fill="#1b1916" stroke="#8a8277"/><text x="60" y="204" fill="#bdb5aa">28f1f</text>
    <circle cx="180" cy="200" r="24" fill="#13221a" stroke="#4fd68b"/><text x="180" y="204" fill="#4fd68b">3edf4</text>
